<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DI-CUT จองคิว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>/* =========================================================
   Design system — shadcn-style components, D1 poster CI
   primary = royal blue · accent = marker yellow · ink = black
   ========================================================= */
/* Layout: one rounded frame (white rim) holding a full-bleed photo canvas; white rim pieces
   (notch, corners, rail, cards) cut into the photo, frosted glass floats on it. */
:root{
  --fd:"Urbanist","Prompt","Noto Sans Thai",system-ui,sans-serif;
  --fb:"Urbanist","Prompt","Noto Sans Thai",system-ui,sans-serif;
  --outer:#CDB79A; --glass:rgba(246,240,232,.72); --glass2:rgba(232,223,211,.56); --glass-line:rgba(255,255,255,.55); --chip:rgba(255,255,255,.32);
  --blue:#3A3530; --blue2:#2A2622; --yellow:#F2D676; --black:#24201C; --amber:#D9A94A; --mint:#9FE0B2; --xbtn:#3A3530; --on-xbtn:#F7F1E8;
  --paper:#EFE7DC; --surface:#FBF7F1; --ink:#2B2621; --muted:#83786B; --off:rgba(110,92,70,.09); --line:rgba(90,72,52,.15);
  --pole:#3A3530; --on-pole:#FBF7F1; --pole-soft:rgba(58,53,48,.08); --ring:rgba(58,53,48,.25);
  --bar:rgba(120,104,84,.16); --bar2:rgba(120,104,84,.30); --bar3:rgba(120,104,84,.46);
  --ok:#4E9A6E; --ok-soft:rgba(159,224,178,.32); --warn:#A8741F; --warn-soft:rgba(242,214,118,.34); --danger:#BE5446; --danger-soft:rgba(190,84,70,.13); --busy-soft:rgba(242,214,118,.3);
  --radius:20px; --r-card:38px;
  --shadow-sm:0 1px 2px rgba(70,50,28,.06);
  --shadow-lg:0 30px 60px -34px rgba(70,50,28,.5);
  --spring:cubic-bezier(.34,1.36,.64,1);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --outer:#1B1714; --glass:rgba(38,32,27,.7); --glass2:rgba(28,24,20,.55); --glass-line:rgba(255,240,220,.09); --chip:rgba(255,240,220,.06);
  --paper:#191512; --surface:#231E1A; --ink:#F2EBE1; --muted:#B5A998; --off:rgba(255,240,220,.07); --line:rgba(255,240,220,.11);
  --pole:#F2D676; --on-pole:#24201C; --pole-soft:rgba(242,214,118,.13); --ring:rgba(242,214,118,.35); --xbtn:#F2EBE1; --on-xbtn:#24201C;
  --bar:rgba(255,240,220,.1); --bar2:rgba(255,240,220,.2); --bar3:rgba(255,240,220,.34);
  --ok:#86D6A4; --ok-soft:rgba(134,214,164,.14); --warn:#E9C063; --warn-soft:rgba(233,192,99,.14); --danger:#F08676; --danger-soft:rgba(240,134,118,.14); --busy-soft:rgba(242,214,118,.14);
  --shadow-sm:none; --shadow-lg:0 30px 60px -30px rgba(0,0,0,.75); color-scheme:dark}}
:root[data-theme="dark"]{
  --outer:#1B1714; --glass:rgba(38,32,27,.7); --glass2:rgba(28,24,20,.55); --glass-line:rgba(255,240,220,.09); --chip:rgba(255,240,220,.06);
  --paper:#191512; --surface:#231E1A; --ink:#F2EBE1; --muted:#B5A998; --off:rgba(255,240,220,.07); --line:rgba(255,240,220,.11);
  --pole:#F2D676; --on-pole:#24201C; --pole-soft:rgba(242,214,118,.13); --ring:rgba(242,214,118,.35); --xbtn:#F2EBE1; --on-xbtn:#24201C;
  --bar:rgba(255,240,220,.1); --bar2:rgba(255,240,220,.2); --bar3:rgba(255,240,220,.34);
  --ok:#86D6A4; --ok-soft:rgba(134,214,164,.14); --warn:#E9C063; --warn-soft:rgba(233,192,99,.14); --danger:#F08676; --danger-soft:rgba(240,134,118,.14); --busy-soft:rgba(242,214,118,.14);
  --shadow-sm:none; --shadow-lg:0 30px 60px -30px rgba(0,0,0,.75); color-scheme:dark}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:none;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ring)}
.ic{flex:none;display:block}
small{font-size:.82em}
.hint{color:var(--muted);font-size:.86rem;margin:0}
.err{color:var(--danger);font-size:.88rem;margin:0}
.okmsg{color:var(--ok);font-weight:500;margin:8px 0 0;font-size:.88rem}

/* ---------- layout ---------- */
main{max-width:1200px;margin:0 auto;padding:0 16px 56px;overflow-x:clip}
.top{display:grid;gap:0 20px}
.top>*,#colA,#secBook{min-width:0}
@media (min-width:900px){.top{grid-template-columns:1.1fr 1fr;align-items:start}}
.sech{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:28px 0 12px;font-family:var(--fd);font-weight:700;font-style:normal;font-size:1.3rem;letter-spacing:-.005em;line-height:1.2}
.sech::before{content:"";width:6px;height:1.05em;border-radius:2px;background:var(--yellow);box-shadow:2px 2px 0 var(--black);transform:skewX(-14deg)}
.upd{margin-left:auto;font:400 .8rem/1 var(--fb);color:var(--muted);font-variant-numeric:tabular-nums}
.livebadge{display:inline-flex;align-items:center;gap:6px;font:600 .72rem/1 var(--fb);color:#fff;background:var(--danger);padding:4px 9px 4px 8px;border-radius:999px}
.livebadge::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- hero (brand) ---------- */
header.hero{color:#fff;border-radius:0 0 28px 28px;margin-bottom:60px;
  background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.10) 0 1.2px,transparent 1.6px) 0 0/9px 9px,
             radial-gradient(120% 90% at 15% 0%,#1550C8 0%,var(--blue) 45%,var(--blue2) 100%)}
.hero-in{max-width:1200px;margin:0 auto;padding:16px 16px 0}
.hero-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.shop{display:flex;gap:14px;align-items:center}
.logo{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;transform:rotate(-10deg);box-shadow:0 0 0 3px var(--yellow),3px 4px 0 3px var(--black)}
.brush{display:inline-block;background:var(--yellow);color:var(--black);padding:.05em .55em .12em;
  clip-path:polygon(1% 14%,9% 2%,28% 8%,52% 0,77% 6%,99% 0,96% 42%,100% 90%,74% 100%,49% 93%,24% 100%,0 92%,3% 52%)}
.hero h1{margin:0;font-family:var(--fd);font-size:1.4rem;font-weight:800;font-style:normal;line-height:1.25}
.shop p{margin:4px 0 0;color:rgba(255,255,255,.82);font-size:.88rem}
.slogan{margin:18px 0 0;font-family:var(--fd);font-size:clamp(1.65rem,5.4vw,2.5rem);font-weight:800;font-style:normal;line-height:1.08;text-shadow:3px 3px 0 var(--black);transform:rotate(-2deg);transform-origin:left}
.slogan span{margin-top:6px;text-shadow:none;font-size:.8em}
.auth{display:flex;gap:8px;align-items:center}
.hero .ghost{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff;backdrop-filter:blur(6px)}
.hero .ghost:hover{background:rgba(255,255,255,.22)}
.who{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:999px;background:var(--yellow);color:var(--black);font-weight:600;font-size:.88rem}
.sumcard{position:relative;top:44px;margin-top:-12px;background:var(--surface);color:var(--ink);border-radius:20px;padding:16px 18px;border:1px solid var(--line);box-shadow:var(--shadow-lg)}
.sumcard::before{content:"";position:absolute;left:18px;right:18px;top:-1px;height:3px;border-radius:0 0 3px 3px;background:var(--yellow)}
@media (min-width:900px){.sumcard{max-width:540px}}
.sum-top{display:flex;justify-content:space-between;color:var(--muted);font-size:.86rem;font-weight:500}
.clock{font-variant-numeric:tabular-nums;color:var(--pole);font-weight:600}
.sum-big{font-family:var(--fd);font-size:2.2rem;font-weight:700;line-height:1.2;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.sum-big small{font:400 .9rem var(--fb);color:var(--muted)}
.sum-row{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.sum-row div{flex:1;text-align:center;font-size:.78rem;color:var(--muted)}
.sum-row b{display:block;font-size:1.15rem;color:var(--ink);font-weight:600}

/* ---------- card ---------- */
.step,.bq,.tk,dialog{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm)}
.step{padding:16px;margin-top:12px}
.step:first-of-type{margin-top:0}
.step h2,.step h3{margin:0 0 12px;font-size:1rem;font-weight:600}

/* ---------- buttons (cva-style variants) ---------- */
.primary,.ghost,.mini,.actions button,.pcode,.del,.info,.icon-btn,.wp-today,.cxbtn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;
  font-weight:500;font-size:.92rem;line-height:1.2;cursor:pointer;white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,transform .1s}
.primary{height:42px;padding:0 20px;background:var(--pole);color:var(--on-pole);box-shadow:0 1px 2px rgba(11,58,158,.25)}
.primary:hover{filter:brightness(1.08)}
.primary:active{transform:scale(.98)}
.ghost{height:38px;padding:0 14px;background:var(--surface);border-color:var(--line);color:var(--ink)}
.ghost:hover{background:var(--off)}
.mini{height:32px;padding:0 12px;font-size:.84rem;background:var(--surface);border-color:var(--line)}
.mini:hover{background:var(--off)}
.mini.okm{background:var(--pole);border-color:var(--pole);color:var(--on-pole)}
.del{height:36px;padding:0 12px;background:transparent;color:var(--danger)}
.del:hover{background:var(--danger-soft)}
.icon-btn{width:34px;height:34px;padding:0;border-radius:8px;background:transparent;color:var(--ink)}
.icon-btn:hover{background:var(--off)}
.wp-today{height:30px;padding:0 10px;border-radius:8px;font-size:.8rem;background:var(--pole-soft);color:var(--pole)}
.linkbtn{display:inline-flex;align-items:center;gap:6px;margin-left:auto;font:500 .84rem var(--fb);background:none;border:0;color:var(--pole);cursor:pointer;padding:4px 2px}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}
.primary:disabled,.ghost:disabled,.mini:disabled,.icon-btn:disabled,button:disabled{opacity:.45;pointer-events:none}
.pcode{height:32px;padding:0 12px;background:var(--yellow);color:var(--black);font-weight:700;letter-spacing:.03em;border-radius:999px}

/* ---------- inputs ---------- */
.form{display:grid;gap:12px}
.form label{display:grid;gap:6px;font-size:.86rem;font-weight:500;color:var(--ink)}
.form input,.form select,.form textarea,.hrs input,.set-grid input,.search,.codebox input,.srow input{
  height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);font-size:.95rem;min-width:0;transition:border-color .15s,box-shadow .15s}
.form textarea{height:auto;padding:10px 12px;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus,.hrs input:focus,.set-grid input:focus,.search:focus,.codebox input:focus,.srow input:focus{outline:none;border-color:var(--pole);box-shadow:0 0 0 3px var(--ring)}
::placeholder{color:var(--muted);opacity:.8}

/* ---------- badge / chip ---------- */
.badge,.chip,.pill,.ptag,.qtag,.wk{display:inline-flex;align-items:center;gap:4px;border-radius:999px;font-size:.74rem;font-weight:600;line-height:1;padding:4px 8px;white-space:nowrap;border:1px solid transparent}
.badge{background:var(--off);color:var(--ink)}
.chip{background:var(--off);color:var(--muted)}
.chip.confirmed{background:var(--pole-soft);color:var(--pole)}
.chip.inprogress{background:var(--yellow);color:var(--black)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.noshow,.chip.cancelled{background:var(--danger-soft);color:var(--danger)}
.ptag,.qtag{background:var(--yellow);color:var(--black);padding:2px 6px;border-radius:5px;font-style:normal}
.wk{background:var(--off);color:var(--muted);margin-left:4px;padding:2px 6px}

/* ---------- avatar ---------- */
.av{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;flex:none;object-fit:cover;font-weight:600;font-size:.9rem;color:#fff;background:hsl(var(--h,220) 45% 42%)}
.av.sm{width:30px;height:30px;font-size:.8rem}
.av.md{width:40px;height:40px}
.av.xl{width:84px;height:84px;font-size:1.9rem;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--yellow)}
.anyav{background:var(--yellow)!important;color:var(--black)!important}

/* ---------- sliding indicator ---------- */
[data-ind]{position:relative;isolation:isolate}
.ind{position:absolute;left:0;top:0;z-index:-1;border-radius:10px;background:var(--pole);pointer-events:none;opacity:0;transform-origin:center;
  transition:transform .5s var(--spring),width .5s var(--spring),height .5s var(--spring),opacity .2s ease}
.ind.soft{background:var(--pole-soft);box-shadow:inset 0 0 0 2px var(--pole);border-radius:14px}
[data-ind]:not([data-ind-soft]) [aria-pressed="true"]{background:transparent!important;border-color:transparent!important;color:var(--on-pole)!important}
[data-ind]:not([data-ind-soft]) [aria-pressed="true"] *{color:inherit}
@media (prefers-reduced-motion:reduce){.ind{transition:opacity .15s}.livebadge::before{animation:none}}

/* ---------- week picker (DeliveryScheduler) ---------- */
.wp{display:grid;gap:12px}
.wp-card{padding:16px 16px 12px}
.wp-label{font-size:.84rem;font-weight:500;color:var(--muted)}
.wp-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.wp-nav h4{margin:0;font-size:1.02rem;font-weight:600}
.wp-btns{display:flex;align-items:center;gap:4px}
.wp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wp-col{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.wp-dow{font-size:.74rem;color:var(--muted)}
.wp-day{width:100%;max-width:46px;height:42px;border-radius:10px;border:0;background:transparent;font-weight:600;font-size:.95rem;cursor:pointer;font-variant-numeric:tabular-nums;transition:background-color .15s,color .2s}
.wp-day:hover{background:var(--off)}
.wp-day.is-today{box-shadow:inset 0 0 0 1px var(--line)}
.wp-day.is-today span{border-bottom:2px solid var(--yellow)}
.wp-day:disabled{opacity:.35}
.wp-sub{font-size:.68rem;line-height:1;color:var(--muted);white-space:nowrap}
.wp-sub.ok{color:var(--ok);font-weight:600}
.wp-sub.full{color:var(--danger)}
.wp-sub.cnt{color:var(--pole);font-weight:600}
.wp-time{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.wp-tz{display:flex;align-items:center;gap:6px;margin:0;font-size:.86rem;font-weight:500}
.slotwrap{margin-top:2px}
.sg{margin:14px 0 8px;font-size:.82rem;font-weight:600;color:var(--muted)}
.sg small{font-weight:400}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots button{position:relative;height:42px;border:0;border-radius:10px;background:var(--off);font-weight:500;font-variant-numeric:tabular-nums;cursor:pointer;transition:background-color .15s,color .2s}
.slots button:hover{background:var(--pole-soft)}
.slots button i{position:absolute;top:-7px;right:-3px;font-style:normal;font-size:.6rem;font-weight:700;background:var(--ok);color:#fff;padding:2px 6px;border-radius:999px;line-height:1}
.slots button u{position:absolute;top:-7px;left:-3px;text-decoration:none;font-size:.6rem;font-weight:700;background:var(--yellow);color:var(--black)!important;padding:2px 6px;border-radius:999px;line-height:1}
.slots button.haspromo{box-shadow:inset 0 0 0 1px var(--yellow)}
.emptybox{margin-top:12px;padding:16px;border-radius:12px;background:var(--off);display:grid;gap:8px;justify-items:start}

/* ---------- wizard ---------- */
.wiz{padding:0;overflow:clip}
.stepper{list-style:none;margin:0;padding:14px 14px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stepper button{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:2px 0 12px;font-size:.78rem;color:var(--muted);position:relative;cursor:default}
.stepper button::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px;background:var(--line);transition:background-color .3s}
.stepper button>span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--off);font-weight:600;font-size:.82rem;transition:background-color .3s,color .3s}
.stepper button:disabled{opacity:1}
.stepper .st-done button{cursor:pointer;color:var(--ink)}
.stepper .st-done button::after{background:var(--pole)}
.stepper .st-done button>span{background:var(--pole);color:var(--on-pole)}
.stepper .st-cur button{color:var(--ink);font-weight:600}
.stepper .st-cur button::after{background:var(--yellow)}
.stepper .st-cur button>span{background:var(--yellow);color:var(--black)}
.wbody{padding:18px 16px 16px;animation:fadeUp .28s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}}
.wt{margin:0;font-size:1.1rem;font-weight:600}
.wbody>.hint{margin:2px 0 14px}
.wbar{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:3}
.wsum{flex:1;min-width:0;line-height:1.3}
.wsum b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92rem;font-weight:600}
.wsum small{color:var(--muted);font-size:.78rem}
.wsum s,.tkl s{color:var(--muted)}
.wsum .net{color:var(--danger);font-weight:700}
.wbar .ghost{background:var(--off);border-color:transparent;padding:0 12px}
.wbar .primary{padding:0 16px}
.wsum small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* services (multi-select) */
.svc{display:grid;gap:8px}
.svc button{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background-color .15s}
.svc button:hover{background:var(--off)}
.svc button[aria-pressed="true"]{border-color:var(--pole);background:var(--pole-soft);box-shadow:inset 0 0 0 1px var(--pole)}
.sn b{font-weight:600}
.sn small{display:block;color:var(--muted)}
.ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent;background:var(--surface);transition:all .15s}
.svc button[aria-pressed="true"] .ck{background:var(--pole);border-color:var(--pole);color:var(--on-pole)}

/* barbers (single select, soft indicator) */
.bsel{display:grid;gap:8px}
.bopt{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:transparent;transition:border-color .2s}
.bopt:has([aria-pressed="true"]){border-color:transparent}
.bopt button[data-barber]{flex:1;display:flex;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:12px;cursor:pointer;min-width:0}
.bopt button[data-barber]:hover{background:color-mix(in srgb,var(--off) 60%,transparent)}
.bt{display:grid;min-width:0}
.bt b{font-weight:600}
.bt small{color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt em{font-style:normal;font-size:.8rem;font-weight:600;color:var(--ok)}
.bt em.no{color:var(--muted);font-weight:400}
.info{padding:0 14px;border:0;border-left:1px solid var(--line);border-radius:0;background:none;font-size:.82rem;color:var(--pole)}
.info:hover{background:var(--off)}

/* quick slot + promos */
.quick{display:grid;gap:10px;border-radius:14px;padding:14px;background:var(--busy-soft);border:1px solid color-mix(in srgb,var(--yellow) 70%,var(--black) 10%)}
.qhead{margin:0;display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink)}
.qhead::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.qk{display:grid;gap:6px}
.qk span{color:var(--muted);font-size:.86rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;cursor:pointer;font-size:.88rem}
.chips button:hover{border-color:var(--pole)}
.chips button[aria-pressed="true"]{background:var(--pole);border-color:var(--pole);color:var(--on-pole)}
.chips small{color:inherit;opacity:.7}
.qnote{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--busy-soft);font-size:.88rem}
.promos{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 12px;margin:0 -2px;scrollbar-width:none}
.promos::-webkit-scrollbar{display:none}
.pcard{flex:0 0 min(80%,300px);scroll-snap-align:start;display:grid;gap:4px;align-content:start;border-radius:16px;padding:16px;color:#fff;box-shadow:var(--shadow-sm);
  background:radial-gradient(circle at 90% 15%,rgba(255,255,255,.12) 0 1.2px,transparent 1.6px) 0 0/8px 8px,linear-gradient(150deg,#6B5A45,var(--blue2))}
.pcard .pval{justify-self:start;font-family:var(--fd);font-weight:800;font-style:normal;font-size:1.3rem;transform:rotate(-3deg);margin:-4px 0 6px -4px}
.pcard h3{margin:0;font-size:1.02rem;font-weight:600}
.pcard p{margin:0;color:rgba(255,255,255,.85);font-size:.88rem}
.pcard small{color:rgba(255,255,255,.7);font-size:.78rem}
.pcard .pauto{color:var(--yellow);font-weight:600}
.pcard .pcode{justify-self:start;margin-top:8px}

/* summary ticket */
.tk{padding:14px;margin-top:12px;box-shadow:none}
.tkh{display:flex;gap:12px;align-items:center}
.tkh b{font-weight:600}
.tkh small{display:block;color:var(--muted);font-size:.84rem}
.tkl{display:grid;gap:6px;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;font-size:.9rem}
.tkl div{display:flex;justify-content:space-between;gap:12px}
.tkl div span:first-child{color:var(--muted)}
.tkl .disc,.tkl .disc span:first-child{color:var(--danger)}
.tkl .tot{font-weight:700;font-size:1rem;margin-top:4px}
.tkl .tot span:first-child{color:var(--ink)}
.codebox{display:flex;gap:8px;margin-top:12px}
.codebox input{flex:1;text-transform:uppercase;letter-spacing:.04em;border-style:dashed}
.ticket{padding:0;overflow:hidden;box-shadow:var(--shadow-lg);animation:pop .4s var(--spring) both}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.tk-top{background:var(--blue);color:#fff;text-align:center;padding:22px 16px 18px}
.tk-top p{margin:0;color:rgba(255,255,255,.82);font-size:.88rem}
.tk-top .code{font-family:var(--fd);font-size:2.3rem;font-weight:800;font-style:normal;letter-spacing:.06em;color:var(--yellow);text-shadow:3px 3px 0 var(--black);margin:4px 0}
.tk-cut{border-top:2px dashed var(--line);margin:0 18px}
.tk-body{padding:16px}
.tk-body .tk{border:0;padding:0;margin:0}
.ticket.cxd .tk-top{background:var(--muted)}
.ticket.cxd .code{text-decoration:line-through;color:#fff}
.note{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--off);color:var(--muted);font-size:.84rem}
.okbanner{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-size:.9rem}
.okbanner b{margin-right:6px}
.cxbox{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px;padding:12px;border-radius:12px;background:var(--off);font-size:.88rem}
.cxbox small{display:block;color:var(--muted)}
.cxbox.late{background:var(--warn-soft);color:var(--warn)}
.cxbtn{height:34px;padding:0 12px;background:var(--surface);border-color:var(--danger);color:var(--danger)}
.cxbtn:hover{background:var(--danger-soft)}
.cxmsg{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--danger-soft);color:var(--danger);font-weight:600;text-align:center}

/* ---------- live status ---------- */
.live{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.st{display:grid;gap:2px;align-content:start;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.st b{display:flex;align-items:center;gap:8px;font-weight:600}
.st b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.st.free b::before{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.st.busy b::before{background:var(--yellow);box-shadow:0 0 0 1.5px var(--black)}
.st.wait b::before{background:var(--warn)}
.st em{justify-self:start;font-style:normal;font-weight:600;font-size:.84rem}
.st.free em{color:var(--ok)} .st.wait em{color:var(--warn)} .st.off em{color:var(--muted)}
.st.busy em{background:var(--yellow);color:var(--black);padding:1px 6px;border-radius:4px}
.st span{font-size:.82rem;color:var(--muted)}
.st .mini{justify-self:start;margin-top:6px}

/* ---------- today's customers ---------- */
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.cg{display:grid;gap:6px;align-content:start}
.cgh{margin:0 0 2px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem}
.cgh span{min-width:22px;text-align:center;padding:1px 7px;border-radius:999px;background:var(--off);color:var(--muted);font-size:.76rem}
.g-busy .cgh span{background:var(--yellow);color:var(--black)}
.g-wait .cgh{color:var(--warn)} .g-done .cgh{color:var(--ok)}
.crow{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;cursor:pointer;transition:background-color .15s}
button.crow:hover{background:var(--off)}
.crow.ro{cursor:default}
.g-busy .crow{box-shadow:inset 3px 0 0 var(--yellow)} .g-wait .crow{box-shadow:inset 3px 0 0 var(--warn)} .g-done .crow{box-shadow:inset 3px 0 0 var(--ok)}
.cl{display:flex;gap:10px;align-items:center;min-width:0}
.crow small{display:block;color:var(--muted);font-size:.78rem}
.crow .ci,.curow .ci{text-align:right;font-size:.86rem;font-variant-numeric:tabular-nums;flex:none}
.late{color:var(--danger)!important}
.walk{margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}

/* ---------- queue board ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:12px}
.toolbar{flex-direction:column;align-items:stretch}
.toolbar>.ghost{align-self:flex-start}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stats div:last-child{grid-column:1/-1;display:flex;align-items:baseline;gap:8px}
@media (min-width:640px){.stats{grid-template-columns:repeat(5,1fr)}.stats div:last-child{grid-column:auto;display:block}}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:.74rem;color:var(--muted);min-width:0}
.stats b{display:block;font-size:1.15rem;color:var(--ink);font-weight:600;line-height:1.3}
.bcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px}
.bq{overflow:hidden;align-self:start}
.bq header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:var(--blue);border-bottom:3px solid var(--yellow)}
.bq.off header{background:var(--off);border-bottom-color:var(--line)}
.bqh{display:flex;gap:10px;align-items:center;background:none;border:0;padding:0;cursor:pointer;text-align:left;color:#fff;min-width:0}
.bqh b{font-weight:600}
.bqh small{display:block;color:rgba(255,255,255,.75);font-size:.78rem}
.bq.off .bqh{color:var(--ink)} .bq.off .bqh small{color:var(--muted)}
.pill{background:rgba(255,255,255,.16);color:#fff;text-align:right;white-space:normal;max-width:55%}
.pill.free{background:var(--ok);color:#fff} .pill.busy{background:var(--yellow);color:var(--black)} .pill.wait{background:#fff;color:var(--warn)}
.bqe{padding:14px}
.qrow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px;cursor:pointer;transition:background-color .15s}
button.qrow:hover{background:var(--off)}
.qrow:last-child{border-bottom:0}
.qrow.ro{cursor:default}
.qrow small{display:block;color:var(--muted);font-size:.78rem}
.qt{font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.qn{min-width:0}
.qn b{font-weight:600}
.qrow.inprogress{background:var(--busy-soft);box-shadow:inset 4px 0 0 var(--yellow)}
.qrow.done .qn,.qrow.done .qt{opacity:.55}
.qrow.noshow{opacity:.5}
.qrow.gap{display:flex;gap:10px;cursor:default;color:var(--ok);font-size:.84rem;background:repeating-linear-gradient(135deg,transparent 0 8px,var(--ok-soft) 8px 10px)}
.qrow.gap .qt{font-weight:500}
.prog{display:block;height:6px;border-radius:999px;background:var(--line);margin:6px 0 2px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:999px;background:var(--pole);transition:width .6s ease}
.cd{color:var(--pole)!important;font-weight:600}
.nowline{display:flex;align-items:center;gap:8px;padding:2px 14px;color:var(--danger);font-size:.72rem;font-weight:700}
.nowline::before,.nowline::after{content:"";height:2px;background:var(--danger);flex:1;border-radius:2px}
.nowline::before{flex:0 0 10px}
.cancelled-list{margin-top:12px;font-size:.86rem;color:var(--muted)}

/* ---------- customers ---------- */
.searchwrap{position:relative;display:flex;align-items:center}
.searchwrap .ic{position:absolute;left:12px;color:var(--muted);pointer-events:none}
.search{width:100%;padding-left:38px!important}
.culist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:12px}
.curow{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;cursor:pointer;transition:background-color .15s}
.curow:hover{background:var(--off)}
.curow>span:nth-child(2){flex:1;min-width:0}
.curow b{font-weight:600}
.curow small{display:block;color:var(--muted);font-size:.78rem}

/* ---------- promotions admin ---------- */
.plist{display:grid;gap:8px}
.prow{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:inset 4px 0 0 var(--yellow)}
.prow.off{opacity:.55;box-shadow:none}
.pinfo{display:grid;gap:2px;min-width:0;flex:1 1 240px}
.pinfo b{font-weight:600}
.pinfo small{color:var(--muted);font-size:.8rem}
.prow .pval{justify-self:start;font-size:.76rem;font-weight:700;background:var(--yellow);color:var(--black);padding:2px 8px;border-radius:5px}
.pact{display:flex;gap:6px}
.pform fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 16px;margin:0}
.pform legend{font-size:.82rem;color:var(--muted);padding:0 4px}
.ckl{display:flex!important;grid-template-columns:none!important;gap:8px;align-items:center;font-weight:400!important}
.ckl input,.form input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:var(--pole)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dchk,.dtog{display:flex;gap:4px;flex-wrap:wrap}
.dchk label{display:block!important}
.dchk input{position:absolute;opacity:0;width:1px;height:1px}
.dchk span,.dtog button{display:inline-grid;place-items:center;width:40px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-size:.84rem;transition:all .15s}
.dchk input:checked+span,.dtog button[aria-pressed="true"]{background:var(--pole);border-color:var(--pole);color:var(--on-pole)}
.dchk input:focus-visible+span{box-shadow:0 0 0 3px var(--ring)}

/* ---------- settings ---------- */
details.step summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;justify-content:space-between}
details.step summary::-webkit-details-marker{display:none}
details.step summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
details.step[open] summary::after{transform:rotate(-135deg)}
.sset{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.sset h3{margin:0 0 10px;font-size:.95rem;font-weight:600}
.hrs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.set-grid{display:grid;gap:12px}
.bcard{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;min-width:0}
.set-grid>*{min-width:0}
.bcard .top{display:flex;gap:8px;align-items:center}
.bcard .top input[type=text]{flex:1;min-width:0}
.srow{display:grid;grid-template-columns:1fr 72px 84px;gap:8px;align-items:center}
.srow small{color:var(--muted);font-size:.78rem}

/* ---------- dialog (sheet) ---------- */
dialog{padding:20px;width:min(92vw,400px);max-height:88vh;overflow:auto;color:var(--ink);box-shadow:var(--shadow-lg);border-radius:20px}
dialog.wide{width:min(94vw,460px)}
dialog[open]{animation:dlgIn .32s var(--spring)}
@keyframes dlgIn{from{opacity:0;transform:translateY(10px) scale(.96)}}
dialog::backdrop{background:rgba(5,12,30,.5);backdrop-filter:blur(3px)}
dialog h3{margin:0 0 2px;font-size:1.15rem;font-weight:600}
dialog .meta{color:var(--muted);margin:0 0 12px;font-size:.88rem}
dialog .row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
dialog .row span{color:var(--muted)}
dialog .row b{font-weight:500;text-align:right}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.actions button{height:40px;padding:0 12px;background:var(--off);color:var(--ink)}
.actions button:hover{filter:brightness(.97)}
.actions .okb{background:var(--pole);color:var(--on-pole)}
.actions .cxb{background:var(--danger-soft);color:var(--danger)}
.phead{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.phead.sm{gap:12px;margin-bottom:6px}
.phead h3{margin:0}
.phead .meta{margin:2px 0 0}
.bio{margin:10px 0 0;line-height:1.6}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tags span{font-size:.8rem;padding:3px 10px;border-radius:999px;background:var(--yellow);color:var(--black);font-weight:600}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pstats div{background:var(--off);border-radius:12px;padding:10px;font-size:.76rem;color:var(--muted);text-align:center}
.pstats b{display:block;font-size:1.1rem;color:var(--ink);font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.psub{margin:16px 0 6px;font-weight:600;font-size:.88rem}
.wdays{display:flex;gap:4px}
.wdays span{flex:1;text-align:center;padding:6px 0;border-radius:8px;font-size:.8rem;background:var(--off);color:var(--muted)}
.wdays span.on{background:var(--pole);color:var(--on-pole)}
.hist{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hist>div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:.88rem}
.hist>div:last-child{border-bottom:0}
.hist small{display:block;color:var(--muted);font-size:.78rem}
.uplrow{display:flex;gap:8px;align-items:center}
.upl{position:relative;display:inline-flex!important;align-items:center;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface);font-weight:500}
.upl:hover{background:var(--off)}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
.upl:focus-within{box-shadow:0 0 0 3px var(--ring)}

/* ---------- toast (sonner-like) ---------- */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px);
  background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-lg);padding:12px 16px;border-radius:12px;font-size:.9rem;z-index:50;animation:toastIn .35s var(--spring)}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pole);flex:none}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}}
[hidden]{display:none!important}

/* =========================================================
   Calm layer — one accent (blue), neutral surfaces,
   yellow only in the brand header, status = small dots
   ========================================================= */
:root{--amber:#B45309;--amber-soft:#FEF3C7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--amber:#FBBF24;--amber-soft:#3A2C0A}}
:root[data-theme="dark"]{--amber:#FBBF24;--amber-soft:#3A2C0A}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}

/* compact header */
header.hero{margin-bottom:0;border-radius:0 0 20px 20px;background:linear-gradient(160deg,#1550C8,var(--blue) 55%,var(--blue2))}
.hero-in{padding:14px 16px 16px}
.slogan{display:none}
.logo{width:40px;height:40px;box-shadow:0 0 0 2px var(--yellow)}
.logo svg{width:20px;height:20px}
.hero h1{font-size:1.15rem}
.sumcard{display:none;top:0;margin-top:14px;box-shadow:none;border:0}
.sumcard::before{display:none}
body[data-view=today] .sumcard{display:block}

/* one screen at a time */
main{max-width:640px;padding-top:4px}
body[data-view=queue] main{max-width:1200px}
#app>[data-v]{display:none}
body[data-view=book] #app>[data-v~=book],body[data-view=live] #app>[data-v~=live],body[data-view=mine] #app>[data-v~=mine],
body[data-view=today] #app>[data-v~=today],body[data-view=queue] #app>[data-v~=queue],body[data-view=cust] #app>[data-v~=cust],
body[data-view=shop] #app>[data-v~=shop]{display:block;animation:fadeUp .25s ease both}

/* headings: plain */
.sech{font-family:var(--fb);font-style:normal;font-weight:600;font-size:1.2rem;margin:22px 0 12px}
.sech::before{display:none}

/* bottom tab bar */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.tabs{display:flex;gap:4px;max-width:560px;margin:0 auto}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;padding:6px 2px;border:0;background:none;border-radius:12px;color:var(--muted);font-size:.72rem;font-weight:500;cursor:pointer}
.tabs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabs button[aria-pressed="true"]{color:var(--pole);font-weight:600}
.tabs .ind.soft{box-shadow:none;border-radius:12px}
.wbar{bottom:calc(72px + env(safe-area-inset-bottom,0px))}

/* status: neutral cards, colour only as dots/text */
.st.busy b::before{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.st.busy em{background:none;color:var(--amber);padding:0}
.st.free b::before{box-shadow:none}
.pill,.pill.free,.pill.busy,.pill.wait{background:var(--off);color:var(--ink);font-weight:500}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.free::before{background:var(--ok)} .pill.busy::before{background:var(--amber)} .pill.wait::before{background:var(--warn)}
.chip.inprogress{background:var(--amber-soft);color:var(--amber)}
.chip.confirmed{background:var(--off);color:var(--ink)}
.cgh,.g-wait .cgh,.g-done .cgh{color:var(--ink)}
.g-busy .cgh span{background:var(--amber-soft);color:var(--amber)}
.g-busy .crow,.g-wait .crow,.g-done .crow{box-shadow:none}
.qrow.inprogress{background:var(--amber-soft);box-shadow:inset 3px 0 0 var(--amber)}
.qrow.gap{background:none;color:var(--muted);font-size:.8rem;padding-top:6px;padding-bottom:6px}
.prog i{background:var(--amber)}

/* barber board: white header */
.bq header{background:var(--surface);border-bottom:1px solid var(--line)}
.bq.off header{background:var(--off)}
.bqh{color:var(--ink)} .bqh small{color:var(--muted)}

/* booking: quieter */
.stepper .st-cur button::after{background:var(--pole)}
.stepper .st-cur button>span{background:var(--surface);color:var(--pole);box-shadow:inset 0 0 0 2px var(--pole)}
.anyav{background:var(--pole-soft)!important;color:var(--pole)!important}
.quick{background:var(--surface);border:1px solid var(--line);box-shadow:inset 3px 0 0 var(--ok)}
.ptag,.qtag{background:var(--pole-soft);color:var(--pole)}
.slots button u{background:var(--pole);color:#fff!important}
.slots button.haspromo{box-shadow:none}
.slots button i{background:var(--ok)}
.wp-day.is-today span{border-bottom:0}
