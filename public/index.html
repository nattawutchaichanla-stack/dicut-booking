body[data-view=today] #secToday{order:1}
.ccgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:14px}
.ccard{display:flex;flex-direction:column;border-radius:20px;overflow:hidden;color:#fff;background:var(--bg-dark);box-shadow:0 10px 24px -12px rgba(0,0,0,.45);min-width:0;transition:transform .2s var(--spring)}
.ccard:hover{transform:translateY(-2px)}
.ccard.blue{background:var(--clr-blue)} .ccard.green{background:var(--clr-green)} .ccard.orange{background:var(--clr-orange);color:#1d1606} .ccard.red{background:var(--clr-red)} .ccard.dark{background:var(--bg-dark)}
.cc-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 18px 0}
.cc-date{font-size:.8rem;font-weight:500;opacity:.9}
.cc-menu{width:32px;height:32px;margin:-6px -8px -6px 0;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:inherit;cursor:pointer}
.cc-menu:hover{background:rgba(255,255,255,.18)}
.cc-body{padding:10px 18px 18px;display:grid;gap:4px;flex:1}
.cc-body h3{margin:0;font-size:1.35rem;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.cc-body p{margin:0;font-size:.88rem;opacity:.9;line-height:1.45}
.cc-prog{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-top:12px;font-size:.78rem;font-weight:600}
.cc-bar{height:6px;border-radius:999px;background:rgba(255,255,255,.3);overflow:hidden}
.ccard.orange .cc-bar{background:rgba(0,0,0,.15)}
.cc-bar i{display:block;height:100%;border-radius:999px;background:#fff;transition:width .6s ease}
.ccard.orange .cc-bar i{background:#1d1606}
.cc-act{margin-top:14px;height:44px;border:0;border-radius:12px;background:#fff;color:#111;font-weight:700;font-size:.95rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.ccard.orange .cc-act{background:#1d1606;color:#fff}
.cc-act:active{transform:scale(.98)}
.cc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;background:var(--bg-footer);color:#fff;min-height:58px}
.cc-foot ul{display:flex;align-items:center;margin:0;padding:0;list-style:none}
.cc-foot li{margin-left:-8px} .cc-foot li:first-child{margin-left:0}
.cc-foot .av{width:34px;height:34px;font-size:.8rem;box-shadow:0 0 0 2px var(--bg-footer)}
.cc-more{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#363636;font-size:.75rem;font-weight:700;box-shadow:0 0 0 2px var(--bg-footer)}
.cc-add{width:34px;height:34px;display:grid;place-items:center;border:1.5px dashed #ddd;border-radius:50%;background:transparent;color:#ddd;cursor:pointer;margin-left:8px}
.cc-foot li:first-child .cc-add{margin-left:0}
.cc-add:hover{border-style:solid;color:#fff;border-color:#fff}
.cc-pill{padding:7px 12px;border-radius:999px;background:#292929;color:#ddd;font-size:.76rem;font-weight:600;white-space:nowrap}
.ccard.green .cc-pill{color:var(--clr-green)} .ccard.blue .cc-pill{color:#69b1ff} .ccard.orange .cc-pill{color:var(--clr-orange)} .ccard.red .cc-pill{color:#e0806e}
@media (max-width:420px){.ccgrid{grid-template-columns:1fr 1fr;gap:10px}.cc-head{padding:12px 12px 0}.cc-body{padding:8px 12px 12px}.cc-body h3{font-size:1.05rem}.cc-body p{font-size:.78rem}
  .cc-prog{grid-template-columns:1fr auto;gap:4px 8px}.cc-prog span:first-child{grid-column:1/-1}.cc-foot{padding:10px 12px;flex-wrap:wrap;gap:8px}.cc-pill{font-size:.7rem;padding:5px 9px}
  .cc-foot .av,.cc-more,.cc-add{width:28px;height:28px}.cc-act{height:40px;font-size:.85rem}
  #secLive .ccgrid{grid-template-columns:1fr}}

/* ===== profile extras ===== */
.mcard{position:relative;overflow:hidden;border-radius:22px;padding:18px 20px;color:#fff;margin-bottom:14px;display:grid;gap:10px;box-shadow:0 14px 30px -14px rgba(0,0,0,.5);
  background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.18) 0 1.2px,transparent 1.6px) 0 0/9px 9px,linear-gradient(135deg,var(--blue),var(--blue2))}
.mcard.t-silver{background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.25) 0 1.2px,transparent 1.6px) 0 0/9px 9px,linear-gradient(135deg,#8E9AAF,#4A5568)}
.mcard.t-gold{background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.25) 0 1.2px,transparent 1.6px) 0 0/9px 9px,linear-gradient(135deg,#E8B931,#9A6A00);color:#1d1606}
.mcard.t-plat{background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.12) 0 1.2px,transparent 1.6px) 0 0/9px 9px,linear-gradient(135deg,#2B2D42,#0B0C14)}
.mc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mc-brand{display:inline-flex;align-items:center;gap:6px;font-family:var(--fd);font-style:normal;font-weight:700;font-size:.95rem}
.mc-tier{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.2)}
.t-plat .mc-tier{background:linear-gradient(90deg,#c0c7d6,#fff);color:#111}
.mc-name{font-size:1.5rem;font-weight:700;margin-top:14px;letter-spacing:.01em}
.mc-row{display:flex;gap:24px}
.mc-row small{display:block;font-size:.68rem;opacity:.75;text-transform:uppercase;letter-spacing:.04em}
.mc-row b{font-variant-numeric:tabular-nums;letter-spacing:.04em}
.mc-prog div{height:5px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.t-gold .mc-prog div{background:rgba(0,0,0,.15)}
.mc-prog i{display:block;height:100%;border-radius:999px;background:currentColor}
.mc-prog small{display:block;margin-top:6px;font-size:.76rem;opacity:.85}
.mc-chip{position:absolute;right:20px;top:52px;width:40px;height:30px;border-radius:7px;background:linear-gradient(135deg,#f6e27a,#c9a227);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.mc-chip::after{content:"";position:absolute;inset:7px 6px;border:1px solid rgba(0,0,0,.25);border-radius:3px}
.insight{display:grid;gap:14px}
.ins-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ins-grid div{padding:10px;border-radius:12px;background:var(--off);display:grid;gap:2px}
.ins-grid small{font-size:.72rem;color:var(--muted)}
.ins-grid b{font-size:1rem}
.ins-grid b.due{color:var(--danger)}
.ins-last{display:flex;gap:12px;align-items:center}
.ins-last small{display:block;color:var(--muted);font-size:.8rem}
.ins-acts .primary{width:100%}
.sc-head b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.sc-head small{color:var(--muted);font-size:.82rem}
.spendchart{width:100%;height:auto;margin-top:8px;display:block}
.sc-bg{fill:var(--off)} .sc-bar{fill:color-mix(in srgb,var(--pole) 45%,var(--surface))} .sc-cur{fill:var(--pole)}
.sc-val{font-size:10px;font-weight:600;fill:var(--ink);text-anchor:middle;font-family:inherit}
.sc-lab{font-size:10px;fill:var(--muted);text-anchor:middle;font-family:inherit} .sc-lab.cur{fill:var(--pole);font-weight:700}
.favs{display:grid;gap:12px}
.fav{display:flex;gap:12px;align-items:center}
.fav-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--pole-soft);color:var(--pole);font-weight:700;font-size:.85rem;flex:none}
.fav:first-child .fav-n{background:var(--pole);color:#fff}
.fav-b{flex:1;min-width:0;display:grid;gap:5px}
.fav-t{display:flex;justify-content:space-between;gap:8px}
.fav-t small{color:var(--muted)}
.fav-bar{height:8px;border-radius:999px;background:var(--off);overflow:hidden}
.fav-bar i{display:block;height:100%;border-radius:999px;background:var(--pole)}
.mcard.t-silver{background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.18) 0 1.2px,transparent 1.6px) 0 0/9px 9px,linear-gradient(135deg,#6B7689,#2F3747)}

/* ===== date picker (ark-ui style) ===== */
.dpk{position:relative}
.dp-label{display:block;margin-bottom:8px;font-size:.86rem;font-weight:500;color:var(--muted)}
.dp-control{display:flex;align-items:center;gap:4px;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s}
.dp-control:focus-within,.dp-control.is-open{border-color:var(--pole);box-shadow:0 0 0 3px var(--ring)}
.dp-input{flex:1;min-width:0;height:40px;border:0;background:transparent;font:inherit;font-weight:600;font-size:.95rem;text-align:center;cursor:pointer;outline:none}
.dp-nav,.dp-trigger,.dp-clear,.dp-ib{width:38px;height:38px;flex:none;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;color:var(--ink);cursor:pointer}
.dp-nav:hover,.dp-trigger:hover,.dp-ib:hover{background:var(--off)}
.dp-trigger{background:var(--pole-soft);color:var(--pole)}
.dp-clear{color:var(--danger)} .dp-clear:hover{background:var(--danger-soft)}
.dp-content{margin-top:10px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow-lg);animation:dlgIn .28s var(--spring)}
.dp-selects{display:flex;gap:8px;margin-bottom:12px}
.dp-selects select{flex:1;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface);font:inherit;font-size:.9rem}
.dp-viewctl{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dp-range{border:0;background:transparent;padding:6px 12px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.dp-range:hover{background:var(--off)}
.dp-table{width:100%;border-collapse:collapse;text-align:center;table-layout:fixed}
.dp-table th{padding:6px 0;font-size:.76rem;font-weight:500;color:var(--muted)}
.dp-table td{padding:2px}
.dp-day{position:relative;width:100%;max-width:44px;aspect-ratio:1;margin:0 auto;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;font:inherit;font-size:.9rem;font-variant-numeric:tabular-nums;cursor:pointer}
.dp-day:hover{background:var(--pole-soft)}
.dp-day.out{color:var(--muted);opacity:.5}
.dp-day.is-today{box-shadow:inset 0 0 0 1.5px var(--pole);font-weight:700}
.dp-day[aria-pressed="true"]{background:var(--pole);color:var(--on-pole);font-weight:700}
.dp-day i{position:absolute;top:2px;right:2px;min-width:15px;height:15px;padding:0 3px;border-radius:999px;font-style:normal;font-size:.58rem;font-weight:700;line-height:15px;background:var(--ok);color:#fff}
.dp-day i.busy{background:var(--warn)}
.dp-day[aria-pressed="true"] i{background:#fff;color:var(--pole)}
.dp-legend{display:flex;gap:14px;justify-content:center;margin-top:8px;font-size:.74rem;color:var(--muted)}
.dp-legend span{display:inline-flex;align-items:center;gap:5px}
.dp-legend i{width:9px;height:9px;border-radius:50%;background:var(--ok)} .dp-legend i.busy{background:var(--warn)}
.dp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dp-cell{display:grid;gap:2px;place-items:center;padding:12px 4px;border:0;border-radius:10px;background:transparent;font:inherit;font-size:.9rem;cursor:pointer}
.dp-cell small{font-size:.66rem;color:var(--ok);font-weight:600}
.dp-cell:hover{background:var(--pole-soft)}
.dp-cell[aria-pressed="true"]{background:var(--pole);color:var(--on-pole)}
.dp-cell[aria-pressed="true"] small{color:#fff}
.dp-foot{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

/* calendar barber faces */
.dp-day{aspect-ratio:auto;height:58px;max-width:48px;align-content:start;padding-top:6px;gap:3px}
.dp-num{line-height:1}
.dp-faces{display:flex;justify-content:center}
.dp-faces .av{margin-left:-5px;box-shadow:0 0 0 1.5px var(--surface)}
.dp-faces .av:first-child{margin-left:0}
.av.xs{width:17px;height:17px;font-size:.55rem;font-weight:700}
.av.xs.more{background:var(--muted)}
.dp-day[aria-pressed="true"] .dp-faces .av{box-shadow:0 0 0 1.5px var(--pole)}
.dp-day i{top:1px;right:1px}
.dp-day.out .dp-faces{opacity:.6}
.dp-sum{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--off);font-size:.86rem}
.dp-sum>b{width:100%;font-weight:600}
.dp-sum>small{color:var(--muted)}
.dp-who{display:inline-flex;align-items:center;gap:8px}
.dp-who small{display:block;color:var(--muted);font-size:.74rem;line-height:1.2}
.dp-legend .av.xs{display:inline-grid}

/* ===== calendar extended ===== */
.dp-active{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:.84rem;color:var(--muted)}
.dp-active b{color:var(--ink)}
.dp-active .linkbtn{margin-left:auto}
.dp-modes{display:flex;width:100%;margin-bottom:10px;padding:3px;border-radius:12px;background:var(--off);border:0}
.dp-modes button{flex:1;border:0;background:transparent;padding:8px;border-radius:10px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer}
.dp-modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}
.dp-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.dp-chips::-webkit-scrollbar{display:none}
.dp-chips button{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 6px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:inherit;font-size:.82rem;cursor:pointer}
.dp-chips button:first-child{padding-left:12px}
.dp-chips button[aria-pressed="true"]{background:var(--pole);border-color:var(--pole);color:var(--on-pole)}
.dp-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
/* heat & range */
.dp-day.h1{background:color-mix(in srgb,var(--ok) 10%,transparent)}
.dp-day.h2{background:color-mix(in srgb,var(--amber) 18%,transparent)}
.dp-day.h3{background:color-mix(in srgb,var(--danger) 16%,transparent)}
.dp-day.closed{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--off) 5px 7px);color:var(--muted)}
.dp-day.in-range{background:var(--pole-soft);border-radius:0}
.dp-day.r-start{border-radius:10px 0 0 10px} .dp-day.r-end{border-radius:0 10px 10px 0} .dp-day.r-start.r-end{border-radius:10px}
.dp-day.r-start,.dp-day.r-end{background:var(--pole);color:var(--on-pole);font-weight:700}
.dp-day:focus-visible{outline:2px solid var(--pole);outline-offset:1px;box-shadow:none}
.dp-slip{position:absolute;left:3px;top:3px;width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 1.5px var(--surface)}
.dp-slip.st{position:static;display:inline-block}
.dp-table th.wkc,.dp-table td.wkc{width:34px;font-size:.7rem;color:var(--muted)}
.dp-table td.wkc span{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:6px;background:var(--off);font-weight:600;color:var(--ink)}
.dp-table td.wkc span:empty{display:none}
.dp-legend{flex-wrap:wrap}
.dp-legend i.lg{width:12px;height:12px;border-radius:4px;border:1px solid var(--line)}
.dp-legend i.lg.h1{background:color-mix(in srgb,var(--ok) 25%,transparent)} .dp-legend i.lg.h2{background:color-mix(in srgb,var(--amber) 35%,transparent)} .dp-legend i.lg.h3{background:color-mix(in srgb,var(--danger) 30%,transparent)}
/* summaries */
.dp-sum{display:grid;gap:12px;margin-top:12px;padding:14px;border-radius:14px;background:var(--off)}
.dp-sum-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dp-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px}
.dp-kpis div{padding:8px 10px;border-radius:10px;background:var(--surface);display:grid}
.dp-kpis b{font-size:1.1rem;font-variant-numeric:tabular-nums}
.dp-kpis small{font-size:.68rem;color:var(--muted)}
.dp-kpis .warn b{color:var(--amber)}
.dp-rows{display:grid;gap:10px}
.dp-row{display:flex;align-items:center;gap:10px}
.dp-row.off{opacity:.55}
.dp-row-b{flex:1;min-width:0;display:grid;gap:4px}
.dp-row-t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dp-row-t small{color:var(--muted);font-size:.74rem;text-align:right}
.dp-cap{height:7px;border-radius:999px;background:var(--surface);overflow:hidden}
.dp-cap i{display:block;height:100%;border-radius:999px;background:var(--pole)}
.dp-cap i.h1{background:var(--ok)} .dp-cap i.h2{background:var(--amber)} .dp-cap i.h3{background:var(--danger)}
.dp-pct{width:38px;text-align:right;font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums}
.dp-go{width:100%}
.dp-best{display:flex;align-items:center;gap:6px;margin:0;font-size:.86rem}
.dp-bars{display:flex;align-items:flex-end;gap:2px;height:48px;padding:4px;border-radius:10px;background:var(--surface)}
.dp-bars span{flex:1;height:100%;display:flex;align-items:flex-end}
.dp-bars i{display:block;width:100%;min-height:2px;border-radius:3px;background:color-mix(in srgb,var(--pole) 55%,var(--surface))}
.dp-bars span.t i{background:var(--pole)}
.dp-cell em{font-style:normal;font-size:.62rem;color:var(--muted)}
.dp-cell[aria-pressed="true"] em{color:rgba(255,255,255,.8)}
.dp-kbd{font-size:.7rem;color:var(--muted);text-align:center;align-self:center}
@media (hover:none){.dp-kbd{display:none}}
.dp-swipe{touch-action:pan-y}

.dp-slip.st,.dp-day .dp-slip{width:9px!important;height:9px!important;padding:0!important;border:0!important;flex:none;box-sizing:border-box}
.dpk{max-width:600px}
.shop p a{white-space:nowrap}
/* v34: pay choice + late policy */
.paychoice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.paychoice button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:inherit;font:inherit;cursor:pointer;position:relative;min-height:104px}
.paychoice button[aria-checked=true]{border-color:var(--pole);box-shadow:0 0 0 3px var(--pole-soft)}
.paychoice .pc-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.paychoice .pc-h em{font-style:normal;font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--ok-soft);color:var(--ok)}
.paychoice .pc-p{font-size:1.15rem;font-weight:700}
.paychoice .pc-p s{font-size:.8rem;font-weight:400;color:var(--muted)}
.paychoice small{font-size:.76rem;color:var(--muted);line-height:1.35}
.latenote{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:.86rem;line-height:1.45}
.latenote .ic{flex:none;margin-top:2px}
.latenote b{display:block}.latenote small{display:block;opacity:.9}
.jrow.overdue{background:var(--danger-soft)}
.jw small.warnt{color:var(--warn)}
.odtag{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:99px;background:var(--danger);color:#fff;font-size:.7rem}
.jbtn.release{background:var(--danger);color:#fff;border-color:var(--danger)}
/* v39: shop graphics */
.hero .logo.has-img{background:#fff center/cover no-repeat;transform:none}
header.hero.has-img{background:linear-gradient(180deg,rgba(6,18,46,.45),rgba(6,18,46,.78)),var(--g-hero) center/cover no-repeat}
body.has-bg::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--g-appBg) center/cover no-repeat;opacity:.1}
:root[data-theme="dark"] body.has-bg::before{opacity:.07}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.has-bg::before{opacity:.07}}
.gban{aspect-ratio:12/5;border-radius:18px;margin:16px 0 4px;background:var(--off) center/cover no-repeat;box-shadow:var(--shadow-sm)}
.gban.dlgart{margin:-4px 0 14px;border-radius:14px}
.av.gav{background-color:var(--off)!important;background-image:var(--g-anyBarber)!important;background-size:cover!important;background-position:center!important}
.svc button.has-th{grid-template-columns:auto 56px 1fr auto}
.sthumb{width:56px;height:56px;border-radius:12px;background:var(--off) center/cover no-repeat;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.emptyart{width:100%;aspect-ratio:16/10;border-radius:12px;background:var(--surface) center/cover no-repeat}
.tk-top.has-img{background:linear-gradient(180deg,rgba(6,18,46,.5),rgba(6,18,46,.82)),var(--g-ticket) center/cover no-repeat}
.ticket.cxd .tk-top.has-img{filter:grayscale(1)}
.mcard.has-img .mc-bg{position:absolute;inset:0;background:center/cover no-repeat;opacity:.38;mix-blend-mode:overlay;pointer-events:none}
.mcard.has-img>:not(.mc-bg):not(.mc-chip){position:relative}
.pcover{aspect-ratio:12/5;margin:-20px -20px 0;background:var(--off) center/cover no-repeat}
.phead.oncover{margin-top:-34px;align-items:flex-end}
.phead.oncover .av.xl{box-shadow:0 0 0 4px var(--surface)}
/* back-office panel */
.gfxdet summary small{margin-left:8px;font-weight:500;color:var(--muted);font-size:.8rem}
.gfxdet summary span{display:inline-flex;align-items:center;gap:8px}
.gtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -2px 10px;scrollbar-width:none}
.gtabs::-webkit-scrollbar{display:none}
.gtabs button{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.86rem;cursor:pointer}
.gtabs button small{font-size:.72rem;color:var(--muted)}
.gtabs button[aria-selected=true]{background:var(--pole);border-color:var(--pole);color:var(--on-pole)}
.gtabs button[aria-selected=true] small{color:inherit;opacity:.8}
.glist{display:grid;gap:10px}
.gslot{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.gprev{width:104px;border-radius:10px;overflow:hidden;background:var(--off);display:grid}
.gprev.g-wide{aspect-ratio:12/5}.gprev.g-card{aspect-ratio:16/10}.gprev.g-sq{aspect-ratio:1}
.gprev.round{width:72px;aspect-ratio:1;border-radius:50%;justify-self:center}
.gimg{background:center/cover no-repeat}
.gimg.contain{background-size:contain;background-color:#fff}
.gph{display:grid;place-items:center;align-content:center;gap:2px;color:var(--muted);background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(0,0,0,.03) 6px 12px)}
.gph small{font-size:.68rem}
.gmeta{display:grid;gap:2px;min-width:0}
.gmeta b{font-size:.92rem;line-height:1.3}
.gmeta small{font-size:.76rem;color:var(--muted);line-height:1.35}
.gmeta .gsz{opacity:.8}
.gact{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-top:6px}
.upl.sm{height:32px;padding:0 12px;font-size:.84rem}
.linkbtn.gdel{color:var(--danger)}
.gact .linkbtn{margin-left:0}
/* v40: LINE */
.lineic{display:inline-grid;place-items:center;height:20px;padding:0 6px;border-radius:6px;background:#06C755;color:#fff;font:800 .64rem/1 system-ui,sans-serif;letter-spacing:.02em}
#lineBtn{position:relative;padding:0 10px}
#lineBtn em,.lpick em{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font:700 .68rem/18px system-ui;font-style:normal;text-align:center}
.lpick em{position:static;display:inline-block;margin-left:4px}
dialog.linedlg{padding:0;width:min(94vw,400px);overflow:hidden;background:#8CABD9}
.lchat{display:flex;flex-direction:column;height:min(78vh,680px)}
.ltop{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#22314F;color:#fff}
.ltop b{display:block;font-size:.95rem}.ltop small{color:#C9D3E8;font-size:.74rem}
.lavatar{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;overflow:hidden;flex:none}
.lavatar i{width:100%;height:100%;background:center/cover no-repeat}
.lclose{margin-left:auto;background:none;border:0;color:#fff;cursor:pointer;padding:6px;display:grid}
.lpick{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#2C3D60;scrollbar-width:none}
.lpick button{flex:none;height:30px;padding:0 12px;border-radius:99px;border:0;background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:.8rem;cursor:pointer}
.lpick button[aria-pressed=true]{background:#06C755}
.lscroll{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px;background:#8CABD9}
.lempty{margin:auto;text-align:center;color:#22314F}.lempty small{color:#33456b}
.lm{display:flex;align-items:flex-end;gap:6px;max-width:100%}
.lm.in{align-self:flex-start}.lm.out{align-self:flex-end}
.lm time{font-size:.66rem;color:#22314F;opacity:.8;flex:none}
.lb{display:inline-block;padding:8px 12px;border-radius:18px;background:#fff;color:#111;font-size:.88rem;line-height:1.45;max-width:270px;white-space:pre-line}
.lm.out .lb{background:#06C755;color:#fff}
.lcard{width:250px;border-radius:16px;overflow:hidden;background:#fff;color:#0B1220;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.lhead{padding:11px 13px;color:#fff}.lhead b{display:block;font-size:.9rem;line-height:1.35}.lhead small{display:block;font-size:.72rem;opacity:.85;margin-top:2px}
.lbody{padding:10px 13px;display:grid;gap:4px}
.lrow{display:grid;grid-template-columns:52px 1fr;gap:8px;font-size:.8rem;line-height:1.4}
.lrow span{color:#5F6B85}.lrow b.n{font-weight:400}
.lnote{margin:6px 0 0;font-size:.72rem;color:#5F6B85;line-height:1.4}
.lslip{width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin-bottom:6px}
.lfoot{padding:0 10px 10px;display:grid;gap:6px}
.lbtn{height:38px;border-radius:8px;border:0;background:var(--c,#0B3A9E);color:#fff;font:600 .86rem var(--fb);cursor:pointer}
.lbtn.ghost{background:#EEF1F7;color:#0B1220}
.lbtn:active{filter:brightness(.92)}
.lbar{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #dfe5ef}
.lbar button{height:34px;padding:0 12px;border-radius:99px;border:1px solid #dfe5ef;background:#fff;color:#22314F;font:inherit;font-size:.8rem;cursor:pointer}
/* notification banner */
#linepop{position:fixed;top:10px;left:50%;transform:translate(-50%,-140%);width:min(calc(100vw - 20px),400px);z-index:80;border-radius:18px;background:rgba(250,251,253,.97);color:#0B1220;box-shadow:0 18px 40px -12px rgba(0,0,0,.4);backdrop-filter:blur(14px);transition:transform .35s var(--spring);overflow:hidden}
#linepop.show{transform:translate(-50%,0)}
.lp-main{display:flex;gap:10px;align-items:center;width:100%;padding:12px 14px;background:none;border:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.lp-ic{flex:none;width:36px;height:36px;border-radius:9px;background:#06C755;color:#fff;display:grid;place-items:center;font:800 .62rem system-ui}
.lp-t b{display:block;font-size:.86rem}.lp-t small{display:block;font-size:.84rem;color:#33415c;line-height:1.35}
.lp-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px}
.lp-acts button{height:38px;border-radius:10px;border:0;background:var(--pole);color:var(--on-pole);font:600 .88rem var(--fb);cursor:pointer}
.lp-acts button.ghost{background:#E8ECF4;color:#0B1220}
:root[data-theme="dark"] #linepop{background:rgba(30,36,50,.97);color:#EEF2FA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #linepop{background:rgba(30,36,50,.97);color:#EEF2FA}:root:not([data-theme="light"]) .lp-t small{color:#C9D3E8}:root:not([data-theme="light"]) .lp-acts button.ghost{background:#2B3346;color:#EEF2FA}}
/* owner settings */
.linedet summary>span{display:inline-flex;align-items:center;gap:8px}
.lstatrow{margin-top:10px;display:grid;gap:2px}
.lstat{justify-self:start;display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.78rem;background:var(--off);color:var(--muted)}
.lstat::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.lstat.ok{background:var(--ok-soft);color:var(--ok)}.lstat.bad{background:var(--danger-soft);color:var(--danger)}
.lsync{font-size:.74rem;color:var(--muted)}
.lh{margin:18px 0 8px;font-size:.92rem}
.ltogs{display:grid;gap:2px}
.ltog{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.ltog:first-child{border-top:0}
.ltog input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--pole)}
.ltog b{display:block;font-size:.9rem;font-weight:600}.ltog small{display:block;font-size:.78rem;color:var(--muted);line-height:1.4}
.ltog small input{width:56px;height:28px;padding:0 6px;margin:0 2px;font-size:.8rem}
.lquota{margin-top:12px;padding:12px;border-radius:12px;background:var(--off);display:grid;gap:8px}
.lquota b{display:block;font-size:.9rem}.lquota small{display:block;font-size:.76rem;color:var(--muted);line-height:1.4}
.lqbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.lqbar i{display:block;height:100%;border-radius:4px}
.lqwarn{margin:0;font-size:.78rem;color:var(--danger);line-height:1.4}
.lstaff{display:grid;gap:8px;margin-top:8px}
.lsrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px}
.lsn b{display:block;font-size:.9rem}.lsn small{font-size:.76rem;color:var(--muted)}.lsn small.ok{color:var(--ok)}
.lsn code{font:700 .9rem ui-monospace,monospace;letter-spacing:.12em;color:var(--ink);background:var(--off);padding:1px 6px;border-radius:6px}
.lsrow .linkbtn{margin-left:0}
.lguide-t{margin:14px 0 0!important}
.lguide{margin:10px 0 0;padding-left:20px;display:grid;gap:10px;font-size:.86rem;line-height:1.5}
.lguide code{font:600 .8rem ui-monospace,monospace;background:var(--off);padding:1px 5px;border-radius:5px}
.lguide a{color:var(--pole)}
.lprev{display:flex;width:100%;box-sizing:border-box;justify-content:center;align-items:center;margin:0}

/* =====================================================================
   v46 SKIN — sunset-desert dashboard: full-bleed photo, frosted panels
   Layout: photo fills the screen; frosted panels sit in a 3-column bento
   (left / photo / right) above a long frosted dock.
   ===================================================================== */
:root{--clr-blue:#5E6E80;--clr-green:#6F9A7E;--clr-orange:#E7C66A;--clr-red:#B9735B;--bg-dark:#3A3530;--bg-footer:#2A2622}
html,body{height:100%}
body{margin:0;padding:0!important;background:var(--outer);font-family:var(--fb);font-size:15px;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--fd);text-wrap:balance}

.frame{position:fixed;inset:0;overflow:hidden;isolation:isolate}
.photo{position:absolute;inset:0;z-index:0;background:#C9B293}
.photo .scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.photo.has-img{background:var(--g-hero) center/cover no-repeat}.photo.has-img .scene{display:none}
.photo::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(40,30,20,.22),rgba(40,30,20,0) 34%,rgba(40,30,20,0) 70%,rgba(40,30,20,.18))}
:root[data-theme="dark"] .photo::after{background:linear-gradient(180deg,rgba(14,10,8,.62),rgba(14,10,8,.46))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .photo::after{background:linear-gradient(180deg,rgba(14,10,8,.62),rgba(14,10,8,.46))}}

.stage{position:absolute;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;padding:26px 30px 112px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.35) transparent;overscroll-behavior:contain;scroll-padding-top:24px}
.stage::-webkit-scrollbar{width:8px}.stage::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:8px}

/* ---------- frosted panel (shared) ---------- */
.gp,.step,.bq,.tk,.jbox,.pcard,.scard,.sumcard,.stats>div,.dp-kpis>div{
  background:linear-gradient(165deg,var(--glass),var(--glass2))!important;-webkit-backdrop-filter:blur(28px) saturate(1.2);backdrop-filter:blur(28px) saturate(1.2);
  border:1px solid var(--glass-line)!important;box-shadow:var(--shadow-lg),inset 0 1px 0 var(--glass-line)!important}
.gp{position:relative;border-radius:var(--r-card);padding:26px 28px;display:flex;flex-direction:column;min-height:0;color:var(--ink)}
.xbtn{position:absolute;top:-4px;right:-4px;width:36px;height:36px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--xbtn);color:var(--on-xbtn);cursor:pointer;z-index:2;
  box-shadow:0 0 0 6px rgba(255,255,255,.22);transition:transform .2s var(--spring)}
.xbtn:hover{transform:rotate(45deg) scale(1.06)}
.xbtn:focus-visible,.gp button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.gp-t{margin:2px 0 18px;text-align:center;font-size:1.28rem;font-weight:500;letter-spacing:-.01em}
.gp small{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.01em}
.gp b{font-weight:500}
.gtag{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:14px;border:1px solid var(--line);background:var(--chip);font-size:.85rem;font-style:normal;white-space:nowrap;color:var(--ink)}
.gtag i{font-style:normal;font-weight:700}
.gtag.free i{color:var(--ok)}.gtag.busy i,.gtag.wait i{color:var(--warn)}

/* ---------- header (pages other than home) ---------- */
header.topbar{position:relative;z-index:3;display:grid;justify-items:center;text-align:center;gap:4px;margin:6px auto 26px;padding:0;background:none!important;color:#fff;border-radius:0}
.vtitle h1{margin:0;font-family:var(--fd);font-weight:500;font-size:clamp(2rem,3.6vw,3.2rem);letter-spacing:-.02em;color:#fff;background:none!important;clip-path:none!important;padding:0!important;text-shadow:0 2px 24px rgba(60,40,20,.25)}
.vtitle p{margin:0;font-size:.95rem;color:rgba(255,255,255,.82);text-shadow:0 1px 12px rgba(60,40,20,.3)}
.vtitle p a{color:inherit}
#shopHours{display:none}
.hpager{display:flex;justify-content:center;gap:10px;margin-top:14px}
body[data-view=home] header.topbar{display:none}

/* ---------- home dashboard ---------- */
#app>[data-v~=home]{display:none}
body[data-view=home] #app>[data-v~=home]{display:block}
main#app{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:0!important;overflow:visible}
body[data-view=home] main#app{max-width:none}
body[data-view=queue] main#app{max-width:1240px}
.hotspots{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.dash{position:relative;z-index:1;display:grid;grid-template-columns:minmax(330px,29%) minmax(0,1fr) minmax(300px,24%);gap:22px;height:calc(100vh - 138px);min-height:620px}
.dcol{display:flex;flex-direction:column;gap:20px;min-width:0;min-height:0}
.gp-a{flex:none}.gp-b{flex:1}.gp-d{flex:1.3}.gp-e{flex:1}
.dtitle{text-align:center;color:#fff;padding-top:8px}
.dtitle h2{margin:0;font-family:var(--fd);font-weight:500;font-size:clamp(2.4rem,3.8vw,3.9rem);letter-spacing:-.025em;line-height:1.05;text-shadow:0 2px 30px rgba(60,40,20,.25)}
.dtitle p{margin:10px 0 0;font-size:1rem;color:rgba(255,255,255,.8);line-height:1.3;text-shadow:0 1px 12px rgba(60,40,20,.3)}
.dtitle p+p{margin-top:4px}
.dspace{flex:1;min-height:40px}
.pager{display:flex;justify-content:center;gap:12px;margin:0 0 4px}
.pg{width:48px;height:48px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;font:500 .95rem var(--fd);cursor:pointer;transition:background-color .2s,transform .2s var(--spring)}
.pg b{font-weight:500}
.pg:hover{background:rgba(255,255,255,.34);transform:translateY(-1px)}
.pg[aria-pressed=true]{background:#F8F3EB;color:#3A3530;box-shadow:0 10px 24px -12px rgba(60,40,20,.5)}

/* A — featured barber */
.pa-row{display:flex;align-items:center;gap:14px}
.pa-row .av{width:58px;height:58px;font-size:1.3rem;flex:none}
.pa-who{min-width:0}.pa-who b{display:block;font-size:1.15rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pa-row .gtag{margin-left:auto}
.pa-bar{width:62%;height:8px;margin:24px auto 0;border-radius:8px;background:var(--bar);overflow:hidden}
.pa-bar i{display:block;height:100%;background:var(--yellow);border-radius:8px}
.gp-cap{margin:12px 0 0;text-align:center;font-size:.82rem;color:var(--muted)}.gp-cap b{color:var(--ink)}
.pa-dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.pa-dots button{width:7px;height:7px;padding:0;border:0;border-radius:4px;background:var(--bar2);cursor:pointer;transition:width .2s}
.pa-dots button[aria-pressed=true]{width:20px;background:var(--ink)}

/* B — hourly density */
.pb-stats{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px}
.pb-stats>div:last-child{text-align:right}
.pb-stats b{font-size:.95rem}
.big{text-align:center;display:grid;justify-items:center}
.big strong{font-family:var(--fd);font-weight:400;font-size:2.5rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.gp-mid{margin:12px 0 8px;text-align:center;font-size:.72rem;color:var(--muted)}
.hbars{flex:1;display:flex;align-items:stretch;gap:6px;min-height:110px;position:relative}
.hb{flex:1;position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;min-width:0}
.hb-plot{position:relative;flex:1}
.hb-cap,.hb-used{position:absolute;left:0;right:0;bottom:0;border-radius:4px}
.hb-cap{background:var(--bar)}
.hb-used{background:var(--bar2)}
.hb.hot .hb-used{background:var(--yellow)}
.hb small{text-align:center;font-size:.62rem!important;font-variant-numeric:tabular-nums}
.hb.now small{color:var(--ink);font-weight:600}
.gtag.peak{position:absolute;left:50%;transform:translateX(-50%);z-index:1;padding:6px 10px;font-size:.72rem;border-radius:10px;background:var(--glass)}

/* C — quick book */
.pc-cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pc-cols button{display:grid;gap:4px;justify-items:start;text-align:left;padding:6px 8px;margin:-6px -8px;border:0;border-radius:14px;background:none;color:var(--ink);cursor:pointer;min-width:0}
.pc-cols button:hover{background:var(--chip)}
.pc-cols b{font-size:1rem;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stripe{display:flex;gap:3px;height:46px;margin-top:18px}
.sb{flex:1;min-width:2px;padding:0;border:0;border-radius:3px;background:var(--bar);cursor:default;transition:background-color .15s}
.sb.part{background:var(--bar2)}.sb.full{background:var(--bar3)}.sb.off{background:var(--off)}
.sb[data-qslot]{cursor:pointer}.sb[data-qslot]:hover{background:var(--yellow)}
.sb.pick{background:var(--yellow)!important}
.sb.nowb{box-shadow:inset 0 0 0 1.5px var(--ink)}
.st-axis{display:flex;justify-content:space-between;margin-top:6px;font-size:.66rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* D — donut */
.pd-top{display:flex;justify-content:space-between;gap:10px}.pd-top>div:last-child{text-align:right}.pd-top b{font-size:.98rem}
.donut{position:relative;flex:1;min-height:110px;max-height:230px;width:100%;margin:8px 0 0}
.donut svg{width:100%;height:100%;display:block}
.d-track{fill:none;stroke:var(--bar);stroke-width:26}
.d-arc{fill:none;stroke:var(--yellow);stroke-width:26;stroke-linecap:round;transition:stroke-dasharray .6s ease}
.d-mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.d-mid b{font-size:1.05rem}
.trio{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;margin-top:auto;padding-top:14px}
.trio>div:last-child{text-align:right}
.trio b{font-size:.98rem}

/* E — wait */
.pe-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pe-top b{display:inline-flex;align-items:center;gap:8px;font-size:1rem}
.pe-top b i{width:6px;height:6px;border-radius:50%;background:var(--ink)}
.pe-bar{height:32px;margin-top:12px;border-radius:6px;background:var(--bar);overflow:hidden}
.pe-bar i{display:block;height:100%;background:var(--mint);border-radius:6px 0 0 6px}

/* hotspots on the photo */
.hs{pointer-events:auto;cursor:pointer;outline:none}
.hs-ring{fill:rgba(255,255,255,.95);stroke:rgba(255,255,255,.35);stroke-width:10}
.hs-core{fill:#3A3530}
.hs-pulse{fill:rgba(255,255,255,0)}
.hs.free .hs-pulse{fill:rgba(255,255,255,.3);animation:hsPulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes hsPulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.6);opacity:0}}
.hs-tip{opacity:0;transition:opacity .2s;pointer-events:none}
.hs-tip rect{fill:rgba(250,246,240,.95)}
.hs-tip text{font:500 19px var(--fb);fill:#2B2621}
.hs:hover .hs-tip,.hs:focus .hs-tip{opacity:1}
.hs:focus .hs-ring{stroke:rgba(255,255,255,.7)}

/* ---------- dock ---------- */
.dock{position:absolute!important;left:30px!important;right:30px!important;bottom:18px!important;top:auto!important;width:auto!important;transform:none!important;height:70px;z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 12px 0 24px!important;border-radius:999px;
  background:linear-gradient(165deg,var(--glass),var(--glass2))!important;-webkit-backdrop-filter:blur(28px) saturate(1.2);backdrop-filter:blur(28px) saturate(1.2);
  border:1px solid var(--glass-line)!important;box-shadow:var(--shadow-lg)!important;color:var(--ink)}
.dk-brand{display:flex;align-items:center;gap:10px;min-width:0;font-family:var(--fd);font-weight:500;font-size:1.06rem}
.dk-brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-logo{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--xbtn);color:var(--on-xbtn);flex:none;font-style:normal}
.dk-logo.img{background:#fff center/cover no-repeat}
.dk-mid{display:flex;align-items:center;gap:10px;position:absolute;left:50%;transform:translateX(-50%)}
.dk-ic{position:relative;width:42px;height:42px;border-radius:50%;border:0;background:none;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.dk-ic:hover{background:var(--chip)}
.dk-ic:disabled{opacity:.35;cursor:default;background:none}
.dk-ic em{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.dk-pill{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px 0 24px;border:0;border-radius:999px;background:var(--chip);color:var(--ink);font:500 .98rem var(--fb);cursor:pointer;box-shadow:inset 0 0 0 1px var(--glass-line)}
.dk-count{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:none;color:var(--ink);font:600 .95rem var(--fd);cursor:pointer;font-variant-numeric:tabular-nums}
.dk-count:hover,.dk-pill:hover{background:var(--chip)}
.dk-cta{display:inline-flex;align-items:center;gap:14px;height:50px;padding:0 6px 0 18px;border:0;border-radius:999px;background:none;color:var(--ink);font:500 .95rem var(--fb);cursor:pointer}
.dk-cta i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--chip);font-style:normal}
.dk-cta:hover i{background:var(--xbtn);color:var(--on-xbtn)}
.dock .ind{display:none!important}
.dock button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- popover + sheets ---------- */
.popover{position:absolute;z-index:60;background:var(--surface);color:var(--ink);border-radius:26px;padding:14px;box-shadow:0 30px 60px -24px rgba(50,36,20,.5),0 0 0 1px var(--line);animation:popIn .22s var(--spring)}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.poph{margin:2px 6px 10px;font-family:var(--fd);font-weight:600;font-size:1rem}.poph small{font-weight:400;color:var(--muted);font-size:.78rem;margin-left:6px}
.poplist{display:grid;gap:4px;max-height:320px;overflow:auto}
.poplist button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:16px;background:none;color:inherit;text-align:left;cursor:pointer;font:inherit}
.poplist button:hover{background:var(--off)}
.poplist button[aria-pressed="true"]{background:var(--pole-soft);font-weight:600}
.poplist span{flex:1;display:grid;font-weight:500}.poplist small{font-weight:400;color:var(--muted);font-size:.78rem}
.poplist b{font-variant-numeric:tabular-nums}
.popdone{width:100%;margin-top:10px;height:46px;border:0;border-radius:999px;background:var(--pole);color:var(--on-pole);font-weight:600;cursor:pointer}
.popdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.popdays button{display:grid;justify-items:center;gap:1px;padding:8px 0;border:0;border-radius:16px;background:var(--off);color:inherit;cursor:pointer}
.popdays button small{font-size:.68rem;color:var(--muted)}.popdays button b{font-family:var(--fd);font-size:1.05rem}.popdays button i{font-style:normal;font-size:.6rem;color:var(--ok)}
.popdays button[aria-pressed="true"]{background:var(--pole);color:var(--on-pole)}.popdays button[aria-pressed="true"] small,.popdays button[aria-pressed="true"] i{color:inherit;opacity:.8}
.popdays button:disabled{opacity:.4;cursor:not-allowed}.popdays button:disabled i{color:var(--muted)}
.mesheet{display:grid;gap:16px}
.mesheet>h3{margin:0}
.melist{display:grid;gap:8px}
.melist>button{display:flex;align-items:center;gap:12px;height:58px;padding:0 18px;border:0;border-radius:20px;background:var(--off);color:var(--ink);font:500 1rem var(--fb);cursor:pointer;text-align:left}
.melist>button span{flex:1}
.melist>button.danger{color:var(--danger)}
.meseg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;border-radius:22px;background:var(--off)}
.meseg button{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;border:0;border-radius:16px;background:none;color:var(--muted);font:500 .9rem var(--fb);cursor:pointer}
.meseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 6px 16px -10px rgba(50,36,20,.5)}

/* =====================================================================
   Components on other pages
   ===================================================================== */
.sech{font-family:var(--fd)!important;font-weight:500!important;font-size:1.45rem!important;letter-spacing:-.01em;margin:30px 6px 14px!important;color:#fff!important;text-shadow:0 1px 16px rgba(60,40,20,.35)}
#app>div>.sech:first-child{margin-top:0!important}

dialog{border:0!important;border-radius:36px!important;padding:26px!important;box-shadow:0 40px 80px -30px rgba(40,28,16,.6)!important;background:var(--surface);color:var(--ink)}

.form input,.form select,.form textarea,.hrs input,.set-grid input,.search,.codebox input,.srow input,.mynote textarea{border-radius:16px!important;border:1px solid var(--line)!important;background:var(--chip)!important;height:50px;padding:0 16px;color:var(--ink)}
.form textarea,.mynote textarea{height:auto;padding:12px 16px}
.form input:focus,.form select:focus,.form textarea:focus,.search:focus,.codebox input:focus,.mynote textarea:focus{background:var(--surface)!important;border-color:var(--ink)!important;box-shadow:0 0 0 4px var(--ring)!important}
.form label,.form>label{font-weight:500;font-size:.88rem;color:var(--muted)}
.chip,.badge,.pill,.ptag,.qtag,.pbadge{border-radius:999px!important}
.linkbtn{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* wizard */
.wiz{padding:0!important;overflow:visible}
.stepper{padding:20px 20px 4px!important;gap:8px!important}
.stepper button{padding:0 0 12px!important;font-size:.82rem!important;color:var(--muted)}
.stepper button::after{height:4px!important;border-radius:4px!important;background:var(--bar)!important}
.stepper button>span{width:34px!important;height:34px!important;font-size:.9rem!important;background:var(--off)!important;color:var(--muted)}

.stepper .st-done button{color:var(--ink)!important}

.wbody{padding:18px 24px 24px!important}
.wt{font-family:var(--fd);font-size:1.35rem!important;font-weight:500}
.svc button{border-radius:22px!important;border:1px solid transparent!important;background:var(--chip)!important;padding:16px 18px!important;color:var(--ink)}
.svc button:hover{border-color:var(--line)!important}

.svc .ck{border-radius:50%!important;width:24px!important;height:24px!important}

.bcardx>button{border-radius:30px!important;border:1px solid transparent!important;background:var(--chip)!important;padding:22px 14px 18px!important;color:var(--ink)}
.bcardx>button[aria-pressed="true"]{background:var(--surface)!important;border-color:var(--ink)!important}
.bgrid .ind,.slotwrap .ind{display:none!important}
.slots button{height:48px!important;border-radius:999px!important;background:var(--chip)!important;font-family:var(--fd);font-size:1rem;color:var(--ink);border:1px solid var(--line)!important}
.slots button:hover{background:var(--yellow)!important;color:#2B2621}
.slots button[aria-pressed="true"]{background:var(--xbtn)!important;color:var(--on-xbtn)!important;border-color:var(--xbtn)!important}
.wp-day{border-radius:20px!important}
.wbar{position:sticky!important;bottom:12px!important;margin:18px 12px 0;border:1px solid var(--glass-line)!important;border-radius:999px!important;padding:10px 10px 10px 24px!important;
  background:linear-gradient(165deg,var(--glass),var(--glass2))!important;-webkit-backdrop-filter:blur(24px) saturate(1.2);backdrop-filter:blur(24px) saturate(1.2);box-shadow:var(--shadow-lg)!important;z-index:5}
.wbar .primary{height:52px}
.wsum b{font-family:var(--fd);font-weight:600}
.paychoice button{border-radius:24px!important;border:1px solid transparent!important;background:var(--chip)!important;color:var(--ink)}
.paychoice button[aria-checked=true]{background:var(--surface)!important;border-color:var(--ink)!important}
.paystep,.paybox,.latenote,.paynote,.cxbox,.loyban,.codebox,.emptybox,.quick,.okbanner{border-radius:24px!important}
.paynote,.loyban{background:var(--chip)!important;color:var(--ink)!important}
.tqr{border-radius:28px!important;overflow:hidden}

.ad-cta{border-radius:999px!important}

.tk-top{background:var(--blue)!important}

.jbox header{border-radius:var(--r-card) var(--r-card) 0 0;background:var(--chip)!important}
.jbtn{border-radius:999px!important}
.jbtn.start{background:var(--pole)!important;color:var(--on-pole)!important}
.ccard,.mcard{border-radius:34px!important}
.bq header{border-radius:var(--r-card) var(--r-card) 0 0}
.dp-day,.dp-cell{border-radius:14px}
.toast{border-radius:999px!important;background:var(--xbtn)!important;color:var(--on-xbtn)!important;border:0!important;box-shadow:0 20px 40px -20px rgba(40,28,16,.6)!important;bottom:100px!important;z-index:90}
.toast::before{background:var(--yellow)!important}
.gslot,.lsrow,.prow,.curow{border-radius:22px!important}
details.step summary{font-family:var(--fd);font-size:1.1rem}
dialog.linedlg{padding:0!important;border-radius:32px!important;overflow:hidden}
.linedet .lprev{height:54px}
.lprev{display:flex;width:100%;box-sizing:border-box;justify-content:center;align-items:center;margin:0}
.ntag{font-style:normal;font-size:.68rem;font-weight:500;padding:1px 8px;border-radius:999px;background:var(--off);color:var(--muted);margin-left:4px;white-space:nowrap}
.loynote{display:flex;align-items:flex-start;gap:8px;margin:10px 0 0;padding:10px 14px;border-radius:16px;background:var(--off);color:var(--muted);font-size:.84rem;line-height:1.45}

.histcard{padding:0!important;overflow:hidden}
.hsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:20px 24px 16px;border-bottom:1px solid var(--line)}
.hsum div{display:grid;gap:2px;min-width:0}

function isFree(bid,date,start,dur,lead=15){
  const b=barber(bid);
  if(!works(b,date)||start<winStart(b)||start+dur>winEnd(b))return false;
  if(date===today()&&start<nowMin()+lead)return false;
  return !bookings.some(x=>x.barberId===bid&&x.date===date&&blocking(x)&&start<endOf(x)&&x.start<start+dur);
}
function freeBarber(pref,date,start,dur,lead=15){
  if(pref!=='any')return isFree(pref,date,start,dur,lead)?pref:null;
  const c=cfg.barbers.filter(b=>isFree(b.id,date,start,dur,lead)); if(!c.length)return null;
  const load=id=>bookings.filter(x=>x.barberId===id&&x.date===date&&blocking(x)).length;
  return c.sort((a,b)=>load(a.id)-load(b.id))[0].id;
}

/* ---------- live status ---------- */
function liveOf(b){
  const t=today(), nm=nowMin();
  if(!works(b,t))return{cls:'off',head:'วันหยุด',sub:'ไม่เข้าร้านวันนี้'};
  if(nm<winStart(b))return{cls:'off',head:'ยังไม่เข้างาน',sub:'เข้างาน '+fmt(winStart(b))};
  if(nm>=winEnd(b))return{cls:'off',head:'เลิกงานแล้ว',sub:'เลิก '+fmt(winEnd(b))};
  const mine=bookings.filter(x=>x.barberId===b.id&&x.date===t);
  const cut=mine.find(x=>x.status==='inprogress');
  if(cut)return{cls:'busy',head:'กำลังตัด',sub:esc(cut.name)+' · '+bName(cut),tag:'ว่างประมาณ '+fmt(endOf(cut)),cutId:cut.id};
  const due=mine.filter(x=>x.status==='confirmed'&&x.start<=nm+5&&nm<x.start+x.dur).sort((a,c)=>a.start-c.start)[0];
  if(due)return{cls:'wait',head:'ถึงคิวแล้ว ยังไม่เริ่มตัด',sub:esc(due.name)+' นัด '+fmt(due.start),tag:nm>=due.start+lateMin()?'เลย '+(nm-due.start)+' นาที · ปล่อยคิวได้':nm>due.start?'รอได้อีก '+(due.start+lateMin()-nm)+' นาที':'รอลูกค้า',dueId:due.id};
  const next=mine.filter(x=>x.status==='confirmed'&&x.start>nm).sort((a,c)=>a.start-c.start)[0];
  if(next)return{cls:'free',head:'ว่าง',sub:'คิวถัดไป '+fmt(next.start)+' · '+esc(next.name),tag:'ว่างอีก '+(next.start-nm)+' นาที'};
  return{cls:'free',head:'ว่าง',sub:'ไม่มีคิวต่อแล้ว',tag:'ว่างถึง '+fmt(winEnd(b))};
}

function quickSlots(){
  const t=today(), nm=nowMin(), st=Math.ceil((nm+5)/5)*5;
  return cfg.barbers.map(b=>{
    if(liveOf(b).cls!=='free'||st<winStart(b))return null;
    const nexts=bookings.filter(x=>x.barberId===b.id&&x.date===t&&blocking(x)&&endOf(x)>st).map(x=>x.start);
    const until=Math.min(winEnd(b),...nexts), gap=until-st;
    const fit=cfg.services.filter(s=>s.min<=gap);
    return fit.length?{b,st,until,gap,fit}:null}).filter(Boolean);
}

function shopLoad(date){ // minutes of capacity and booked minutes, per hour and in total
  const bs=cfg.barbers.filter(b=>works(b,date)), h0=Math.floor(cfg.open/60), h1=Math.ceil(cfg.close/60), hours=[];
  const bk=bookings.filter(x=>x.date===date&&isLive(x));
  for(let h=h0;h<h1;h++){const a=h*60,z=a+60;
    const cap=bs.reduce((s,b)=>s+xb(a,z,winStart(b),winEnd(b)),0), used=bk.reduce((s,x)=>s+xb(a,z,x.start,x.start+x.dur),0);
    hours.push({h,cap,used:Math.min(used,cap)})}
  const cap=hours.reduce((s,x)=>s+x.cap,0), used=hours.reduce((s,x)=>s+x.used,0);
  return {bs,hours,cap,used,pct:cap?Math.round(used/cap*100):0};
}

const indPrev={};
function syncIndicators(){
  document.querySelectorAll('[data-ind]').forEach(c=>{
    const key=c.dataset.ind; let ind=c.querySelector(':scope>.ind'); const fresh=!ind;
    if(fresh){ind=document.createElement('span');ind.className='ind'+(c.hasAttribute('data-ind-soft')?' soft':'');ind.setAttribute('aria-hidden','true');c.prepend(ind)}
    const sel=c.querySelector('[aria-pressed="true"]');
    if(!sel){ind.style.opacity='0';delete indPrev[key];return}
    const t=sel.closest('[data-ind-item]')||sel, cr=c.getBoundingClientRect(), r=t.getBoundingClientRect();
    if(!r.width)return;
    const pos={x:r.left-cr.left-c.clientLeft+c.scrollLeft,y:r.top-cr.top-c.clientTop+c.scrollTop,w:r.width,h:r.height};
    const set=(q,sc)=>{ind.style.width=q.w+'px';ind.style.height=q.h+'px';ind.style.transform=`translate(${q.x}px,${q.y}px) scale(${sc})`};

const weekOf=k=>{const d=fromKey(k),a=weekStart(0);return Math.floor((d-a)/(7*864e5))};
function weekDaysOf(off){const a=weekStart(off);return [...Array(7)].map((_,i)=>{const d=new Date(a);d.setDate(a.getDate()+i);return d})}

function crc16(str){let c=0xFFFF;for(let i=0;i<str.length;i++){c^=str.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
function ppPayload(id,amount){
  const d=String(id||'').replace(/\D/g,''); if(d.length<10)return '';
  const acc=d.length===15?tlv('03',d):d.length===13?tlv('02',d):tlv('01','0066'+d.slice(-9));
  let p=tlv('00','01')+tlv('01',amount?'12':'11')+tlv('29',tlv('00','A000000677010111')+acc)+tlv('53','764')+(amount?tlv('54',Number(amount).toFixed(2)):'')+tlv('58','TH')+'6304';
  return p+crc16(p);
}
function qrSVG(text){

  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c} ${r}h1v1h-1z`;
  return `<svg class="qr" viewBox="-3 -3 ${n+6} ${n+6}" role="img" aria-label="QR พร้อมเพย์" shape-rendering="crispEdges"><rect x="-3" y="-3" width="${n+6}" height="${n+6}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

function stepTime(){
  const d=selDur(), anyP=livePromos().some(p=>!p.code), lastDay=dkey(addDays(BOOK_WEEKS*7-1));
  if(sel.time===null&&!sel.autoDated&&!daySlots(sel.barber,sel.date,d).length){
    const f=[...Array(BOOK_WEEKS*7)].map((_,i)=>dkey(addDays(i))).find(k=>daySlots(sel.barber,k,d).length);
    if(f){sel.date=f;sel.wk=weekOf(f)}}
  sel.autoDated=true;
  let h=`<h3 class="wt">เลือกวันและเวลา</h3><p class="hint">${sel.barber==='any'?'ร้านจัดช่างที่ว่างให้':'คิวของ'+esc(barber(sel.barber).name)} · ใช้เวลา ${d} นาที</p>`;
  h+=weekPickerHTML({key:'book',label:'วันที่ต้องการ*',off:sel.wk,minOff:0,maxOff:BOOK_WEEKS-1,selected:sel.date,attr:'data-date',
    info:k=>{if(k<today()||k>lastDay)return{disabled:true};const n=daySlots(sel.barber,k,d).length;return n?{sub:n+' ช่วง',cls:'ok'}:{sub:'เต็ม',cls:'full',disabled:true}}});
  const sl=daySlots(sel.barber,sel.date,d);
  h+=`<div class="wp-time"><p class="wp-tz">${ic('clock',16)} เวลาไทย (GMT+7) · ${thaiDate(sel.date)}</p>`;
  if(!sl.length){let nx=null;for(let i=1;i<BOOK_WEEKS*7&&!nx;i++){const k=dkey(new Date(fromKey(sel.date).getTime()+i*864e5));if(k<=lastDay&&daySlots(sel.barber,k,d).length)nx=k}
    return h+`<div class="emptybox">${G('empty')?`<span class="emptyart" style="${gbg('empty')}" aria-hidden="true"></span>`:''}<b>${dayLabel(sel.date)}ไม่มีคิวว่าง</b>${nx?`<button class="ghost" data-date="${nx}">ดูคิว${dayLabel(nx)}</button>`:''}${sel.barber!=='any'?`<button class="ghost" data-barber="any">ให้ร้านจัดช่างให้</button>`:''}</div></div>`}
  h+=`<div class="slotwrap" data-ind="book-time">`;
  [['เช้า',0,720],['บ่าย',720,1020],['เย็น',1020,1440]].forEach(([g,a,z])=>{const gs=sl.filter(t=>t>=a&&t<z);if(!gs.length)return;
    h+=`<p class="sg">${g} <small>${gs.length} ช่วง</small></p><div class="slots">`+gs.map(t=>{const bp=bestPromo(sel.services,sel.date,t,'');return `<button data-time="${t}" class="${bp?'haspromo':''}" aria-pressed="${!sel.quick&&sel.time===t}"><span>${fmt(t)}</span>${t===sl[0]?'<i>เร็วสุด</i>':''}${bp?`<u>-${bp.amt}฿</u>`:''}</button>`}).join('')+`</div>`});
  h+=`</div>${anyP?'<p class="hint" style="margin-top:10px">ช่องที่มีป้ายเหลืองได้ส่วนลด</p>':''}</div>`;
  return h;
}

function selDeal(){ // loyalty reward wins over promos (no stacking)
  const st=loyState(sel.phone);
  if(st&&st.rewards>0&&sel.useLoy){const a=loyAmount(sel.services);if(a>0)return{kind:'loy',title:'ตัด '+st.need+' ฟรี 1',amt:a,st}}
  const bp=sel.time!==null?bestPromo(sel.services,sel.date,sel.time,sel.code):null;
  return bp?{kind:'promo',title:bp.p.title,amt:bp.amt,p:bp.p}:null;
}

async function fileToBanner(file){
  const url=URL.createObjectURL(file),img=new Image();
  await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url});
  const W=960,H=480,c=document.createElement('canvas');c.width=W;c.height=H;
  const sc=Math.max(W/img.width,H/img.height),w=img.width*sc,h=img.height*sc;
  c.getContext('2d').drawImage(img,(W-w)/2,(H-h)/2,w,h);URL.revokeObjectURL(url);
  return c.toDataURL('image/jpeg',.8)}

const TH_DOW=['อา','จ','อ','พ','พฤ','ศ','ส'], TH_MON_S=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

function dayBarbers(k){const m={};liveBk(k).forEach(b=>m[b.barberId]=(m[b.barberId]||0)+1);

function dayLoad(k){ // booked minutes vs working minutes of the filtered barbers
  const bs=dpBarbers().filter(b=>works(b,k)), cap=bs.reduce((a,b)=>a+Math.max(0,winEnd(b)-winStart(b)),0);

const daySlipWait=k=>bookings.some(b=>b.date===k&&b.status==='confirmed'&&b.pay&&b.pay.status==='review'&&inFilter(b));
function rangeKeys(a,z){const out=[];if(!a||!z)return out;const d=fromKey(a);while(dkey(d)<=z){out.push(dkey(d));d.setDate(d.getDate()+1)}return out}

function dpGo(k){adminDate=k;adminWk=weekOf(k);const d=fromKey(k);dp.y=d.getFullYear();dp.m=d.getMonth();dp.focus=k}
function dpFocusKey(k){const d=fromKey(k);if(d.getMonth()!==dp.m||d.getFullYear()!==dp.y){dp.y=d.getFullYear();dp.m=d.getMonth()}dp.focus=k;renderTimeline();
  requestAnimationFrame(()=>document.querySelector(`.dp-day[data-key="${k}"]`)?.focus())}
function dpPreset(p){const t=fromKey(today());let a,z;
  if(p==='week'){a=new Date(t);a.setDate(t.getDate()-t.getDay());z=new Date(a);z.setDate(a.getDate()+6)}
  else if(p==='next7'){a=new Date(t);z=new Date(t);z.setDate(t.getDate()+6)}
  else if(p==='month'){a=new Date(t.getFullYear(),t.getMonth(),1);z=new Date(t.getFullYear(),t.getMonth()+1,0)}
  else{z=new Date(t);a=new Date(t);a.setDate(t.getDate()-29)}
  dp.rs=dkey(a);dp.re=dkey(z);dp.y=z.getFullYear();dp.m=z.getMonth()}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-dp]');
  if(!t){if(dp.open&&!e.target.closest('.dpk')){dp.open=false;renderTimeline()}return}
  const [a,v]=t.dataset.dp.split(':');
  if(a==='toggle'){dp.open=!dp.open;dp.view='day';const d=fromKey(adminDate);dp.y=d.getFullYear();dp.m=d.getMonth();dp.focus=adminDate}
  else if(a==='close')dp.open=false;
  else if(a==='clear'){dpGo(today());if(dp.mode==='single')dp.open=false}
  else if(a==='stepday'){const d=fromKey(adminDate);d.setDate(d.getDate()+(+v));dpGo(dkey(d))}
  else if(a==='day'){
    if(dp.mode==='range'){if(!dp.rs||dp.re){dp.rs=v;dp.re=''}else if(v<dp.rs){dp.re=dp.rs;dp.rs=v}else dp.re=v;dp.focus=v}
    else{dpGo(v)}}
  else if(a==='go'){dpGo(v);dp.open=false}
  else if(a==='mode'){dp.mode=v;if(v==='range'&&!dp.rs)dpPreset('week')}
  else if(a==='preset')dpPreset(v);
  else if(a==='barber')dp.barber=v;
  else if(a==='month'){dp.m=+v;dp.view='day'}
  else if(a==='year'){dp.y=+v;dp.view='month'}
  else if(a==='zoom')dp.view=dp.view==='day'?'month':dp.view==='month'?'year':'day';
  else if(a==='prev'||a==='next')dpShift(a==='next'?1:-1);
  renderAdmin();
  if(dp.open&&(a==='toggle'))requestAnimationFrame(()=>{document.querySelector('.dp-content')?.scrollIntoView({block:'nearest',behavior:'smooth'});document.querySelector('.dp-day[tabindex="0"]')?.focus({preventScroll:true})});
});
function dpShift(s2){if(dp.view==='day'){dp.m+=s2;if(dp.m<0){dp.m=11;dp.y--}if(dp.m>11){dp.m=0;dp.y++}}else if(dp.view==='month')dp.y+=s2;else dp.y+=12*s2}
document.addEventListener('change',e=>{if(e.target.id==='dpYear'){dp.y=+e.target.value;renderTimeline()}else if(e.target.id==='dpMonth'){dp.m=+e.target.value;dp.view='day';renderTimeline()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&dp.open){dp.open=false;renderTimeline();document.getElementById('dpInput')?.focus();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.id==='dpInput'){e.preventDefault();e.target.click();return}
  const cell=e.target.closest&&e.target.closest('.dp-day');if(!cell)return;
  const k=cell.dataset.key, d=fromKey(k), mv={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key];
  if(mv){e.preventDefault();d.setDate(d.getDate()+mv);dpFocusKey(dkey(d))}
  else if(e.key==='PageUp'||e.key==='PageDown'){e.preventDefault();d.setMonth(d.getMonth()+(e.key==='PageDown'?1:-1));dpFocusKey(dkey(d))}
  else if(e.key==='Home'||e.key==='End'){e.preventDefault();d.setDate(d.getDate()+(e.key==='Home'?-d.getDay():6-d.getDay()));dpFocusKey(dkey(d))}

function startWalkin(){
  const name=document.getElementById('wName').value.trim(), s=svc(document.getElementById('wSvc').value), b=barber(document.getElementById('wBarber').value);
  if(!name){toast('ใส่ชื่อลูกค้าก่อน');return}
  if(liveOf(b).cls!=='free'){toast(b.name+' ไม่ว่างแล้ว');renderAdmin();return}
  const t=today(), nm=nowMin();
  const next=bookings.filter(x=>x.barberId===b.id&&x.date===t&&blocking(x)&&x.start>=nm).sort((a,c)=>a.start-c.start)[0];
  const over=Math.max(0,nm+s.min-Math.min(next?next.start:Infinity,winEnd(b)));
  if(over>0&&!confirm(`${s.name} ใช้ ${s.min} นาที จะเกิน${next?'คิวถัดไปของ '+next.name+' ('+fmt(next.start)+')':'เวลาเลิกงาน'} ประมาณ ${over} นาที ตัดต่อเลยไหม?`))return;
  const wp=document.getElementById('wPhone').value.trim();
  bookings.push({id:code(),date:t,start:nm,dur:s.min,barberId:b.id,serviceId:s.id,name,phone:wp,status:'inprogress',startedAt:nm,walkin:true});upsertCustomer(name,wp);
  save();walkOpen=false;renderAdmin();toast(name+' เริ่มตัดกับ'+b.name);
}
function rtInfo(x,nm){
  if(x.status==='inprogress'){const st=x.startedAt??x.start,el=Math.max(0,nm-st),pct=Math.min(100,el/x.dur*100),rem=x.dur-el;
    return `<span class="prog" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></span><small class="${rem<0?'late':''}">${rem>=0?'เหลือประมาณ '+rem+' นาที':'เกินเวลา '+(-rem)+' นาที'}</small>`}
  if(x.status==='confirmed'){if(x.start>nm)return `<small class="cd">อีก ${dur(x.start-nm)}</small>`;
    return `<small class="late">เลยเวลานัด ${nm-x.start} นาที</small>`}
  return '';
}

let gfx={}, gfxDB=null, gfxPersist=true, gfxOpen=true, gfxGroup='brand';

const gvar=k=>'--g-'+k.replace(/[^a-z0-9]/gi,'-');
const gbg=k=>`background-image:var(${gvar(k)})`;
function gfxIDB(){return new Promise(res=>{try{const r=indexedDB.open('barber-gfx',1);r.onupgradeneeded=()=>r.result.createObjectStore('g');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}})}
async function gfxInit(){gfxDB=await gfxIDB();if(!gfxDB){gfxPersist=false;return}
  await new Promise(res=>{try{const tx=gfxDB.transaction('g'),st=tx.objectStore('g'),rq=st.openCursor();
    rq.onsuccess=()=>{const c=rq.result;if(c){gfx[c.key]=c.value;c.continue()}else res()};rq.onerror=()=>res()}catch(e){res()}})}
function gfxWrite(k,v){if(!gfxDB)return Promise.resolve(false);return new Promise(res=>{try{const tx=gfxDB.transaction('g','readwrite');v?tx.objectStore('g').put(v,k):tx.objectStore('g').delete(k);
  tx.oncomplete=()=>res(true);tx.onerror=tx.onabort=()=>res(false)}catch(e){res(false)}})}
const LOGO_SVG=document.querySelector('.hero .logo')?.innerHTML||'';
function applyGfx(){const root=document.documentElement.style;
  [...root].filter(p=>p.startsWith('--g-')).forEach(p=>root.removeProperty(p));
  Object.entries(gfx).forEach(([k,v])=>v&&root.setProperty(gvar(k),`url("${v}")`));
  const lg=document.querySelector('.hero .logo');if(lg){lg.classList.toggle('has-img',!!G('logo'));lg.innerHTML=G('logo')?'':LOGO_SVG;lg.style.backgroundImage=G('logo')?`var(${gvar('logo')})`:''}
  let fav=document.querySelector('link[rel=icon]');if(G('logo')){if(!fav){fav=document.createElement('link');fav.rel='icon';document.head.appendChild(fav)}fav.href=G('logo')}else if(fav)fav.remove();
  document.getElementById('photo')?.classList.toggle('has-img',!!G('hero'));
  document.body.classList.toggle('has-bg',!!G('appBg'));
}

async function fileToGfx(file,[W,H],fit){
  if(file.size>25*1024*1024)throw new Error('big');
  const url=URL.createObjectURL(file),img=new Image();
  await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url});
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const sc=fit==='contain'?Math.min(W/img.width,H/img.height):Math.max(W/img.width,H/img.height),w=img.width*sc,h=img.height*sc;
  x.imageSmoothingQuality='high';x.drawImage(img,(W-w)/2,(H-h)/2,w,h);URL.revokeObjectURL(url);
  const wp=c.toDataURL('image/webp',.82);if(wp.startsWith('data:image/webp'))return wp;
  return fit==='contain'?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.82)}

async function gfxPut(k,file){
  const it=gfxSlots().flatMap(g=>g.items).find(x=>x.k===k); if(!it||!isOwner())return;
  let v; try{v=k.startsWith('bar:')?await fileToAvatar(file):await fileToGfx(file,it.size,it.fit)}catch(e){toast('เปิดไฟล์รูปนี้ไม่ได้ ลองรูป JPG หรือ PNG');return}
  if(k.startsWith('bar:')){const b=cfg.barbers.find(x=>x.id===k.slice(4));if(!b)return;b.photo=v;saveCfg()}
  else if(k==='loy'){loy().img=v;saveCfg()}
  else if(k.startsWith('promo:')){const p=cfg.promos.find(x=>x.id===k.slice(6));if(!p)return;p.img=v;saveCfg()}
  else{gfx[k]=v;const ok=await gfxWrite(k,v);if(!ok&&gfxPersist){gfxPersist=false}}
  gfxRefresh();toast('ใส่ภาพแล้ว: '+it.label)}
async function gfxRemove(k){if(!isOwner())return;
  if(k.startsWith('bar:')){const b=cfg.barbers.find(x=>x.id===k.slice(4));if(b){b.photo='';saveCfg()}}
  else if(k==='loy'){loy().img='';saveCfg()}
  else if(k.startsWith('promo:')){const p=cfg.promos.find(x=>x.id===k.slice(6));if(p){p.img='';saveCfg()}}
  else{delete gfx[k];await gfxWrite(k,null)}
  gfxRefresh();toast('ลบภาพแล้ว กลับไปใช้แบบเดิม')}

function spendChartHTML(past){
  if(!past.length)return '';
  const now=new Date(),months=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({y:d.getFullYear(),m:d.getMonth(),v:0,n:0})}
  past.forEach(b=>{const d=fromKey(b.date),x=months.find(o=>o.y===d.getFullYear()&&o.m===d.getMonth());if(x){x.v+=bPrice(b);x.n++}});
  const max=Math.max(1,...months.map(o=>o.v)), W=320,H=150,bw=34,gap=(W-6*bw)/7, tot=months.reduce((a,o)=>a+o.v,0);
  const bars=months.map((o,i)=>{const h=Math.round(o.v/max*(H-44)),x=gap+i*(bw+gap),y=H-22-h,cur=i===5;
    return `<g><title>${MON[o.m]} ${o.y+543}: ${baht(o.v)} ฿ (${o.n} ครั้ง)</title><rect x="${x}" y="${H-22-(H-44)}" width="${bw}" height="${H-44}" rx="8" class="sc-bg"/>${o.v?`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="8" class="${cur?'sc-cur':'sc-bar'}"/><text x="${x+bw/2}" y="${y-6}" class="sc-val">${o.v>=1000?(o.v/1000).toFixed(1)+'k':o.v}</text>`:''}<text x="${x+bw/2}" y="${H-6}" class="sc-lab ${cur?'cur':''}">${MON[o.m]}</text></g>`}).join('');
  return `<h2 class="sech">ยอดใช้จ่าย 6 เดือน</h2><section class="step"><div class="sc-head"><b>${baht(tot)} ฿</b><small>${months.reduce((a,o)=>a+o.n,0)} ครั้งใน 6 เดือน · เดือนนี้ ${baht(months[5].v)} ฿</small></div>
    <svg class="spendchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟยอดใช้จ่ายรายเดือน">${bars}</svg></section>`;
}

function releaseQueue(id){const b=bookings.find(x=>x.id===id);if(!b||!canManage(b))return;
  const paid=isLocked(b);

  b.status='noshow';b.released=Date.now();if(paid)b.credit=b.pay.amount;save();if(dlg.open)dlg.close();renderAdmin();
  toast('ปล่อยคิวแล้ว ช่วงนี้ว่างให้ลูกค้าคนอื่นจองได้')}
function setStatus(b,v){
  if(!canManage(b)){toast('เฉพาะช่างเจ้าของคิวหรือเจ้าของร้าน');return false}
  if(v==='cancelled'&&!confirm('ยกเลิกคิวของ '+b.name+' ?'))return false;
  if(v==='inprogress'){const busy=bookings.find(x=>x!==b&&x.barberId===b.barberId&&x.date===b.date&&x.status==='inprogress');
    if(busy){alert(barber(b.barberId).name+' ยังตัดให้ '+busy.name+' อยู่ กด “ตัดเสร็จ” คิวนั้นก่อน');return false}
    if(b.status==='confirmed')b.startedAt=nowMin(); delete b.doneAt}
  let msg=STATUS[v];
  if(v==='done'){const before=loyState(b.phone);b.doneAt=nowMin();const early=b.start+b.dur-b.doneAt;
    if(b.date===today()&&early>0)msg='ตัดเสร็จก่อนเวลา '+early+' นาที เปิดคิวด่วนให้ลูกค้าจองแล้ว'}
  if(v==='confirmed'){delete b.startedAt;delete b.doneAt;if(b.released){delete b.released;if(b.credit&&!b.creditUsed)delete b.credit}}
  b.status=v;save();
  if(v==='done'){const st=loyState(b.phone);if(st&&loyEligible(b)&&!b.loyaltyRedeem)msg=st.stamps===0&&st.rewards>0?`${b.name} ครบ ${st.need} แต้ม ได้สิทธิ์ตัดฟรี 1 ครั้ง`:`${b.name} ได้ 1 แต้ม (${st.stamps}/${st.need})`}
  renderAdmin();toast(msg);return true;
}

/* =====================================================================
   LINE notifications
   - Real: sync with the Apps Script backend (Code.gs), which pushes LINE
     messages to barbers and receives their button presses.
   - Preview: an in-app LINE chat that shows exactly what each barber gets,
     with buttons that work, so the shop can try it before setting up LINE.

const BACKEND=()=>(L().url||window.BACKEND_URL||'').trim();
const APP_HOST=()=>window.BACKEND_URL?location.origin:'https://ชื่อแอพ.vercel.app';
var LINE_DEF={url:'',key:'',notify:{newBooking:true,due:true,late:true,slip:true,cancel:true},remindMin:5,ownerCopy:false,preview:true,staff:[]};
var sync={on:false,checking:false,err:'',last:0,since:0,snap:{},queue:{},timer:null,flushT:null,lineSeen:0,staffOk:false};

var lineView='', linePop=null;
function L(){if(!cfg.line)cfg.line=JSON.parse(JSON.stringify(LINE_DEF));const l=cfg.line;
  l.notify=Object.assign({},LINE_DEF.notify,l.notify||{});if(l.remindMin==null)l.remindMin=5;if(l.preview==null)l.preview=true;if(!Array.isArray(l.staff))l.staff=[];return l}
const lineStaffKey=()=>L().key&&user?L().key:'';
const LINE_STAFF=()=>[{id:'owner',name:'เจ้าของร้าน',role:'owner'},...cfg.barbers.map(b=>({id:b.id,name:b.name,role:'barber',photo:b.photo}))];
const lstaffName=id=>id==='owner'?'เจ้าของร้าน':barber(id)?.name||'ช่าง';

/* ---------- stable compare ---------- */
function stab(o){if(Array.isArray(o))return '['+o.map(stab).join(',')+']';if(o&&typeof o==='object')return '{'+Object.keys(o).filter(k=>o[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stab(o[k])).join(',')+'}';return JSON.stringify(o)}

/* ---------- backend calls ---------- */
async function api(body,get){
  const u=BACKEND(); if(!u)throw new Error('ยังไม่ได้ใส่ URL');
  const r=get?await fetch(u+(u.includes('?')?'&':'?')+new URLSearchParams(body),{cache:'no-store'})
            :await fetch(u,{method:'POST',body:JSON.stringify(body)});
  const j=await r.json(); return j;
}
async function lineConnect(manual){
  const l=L(); if(!BACKEND()){sync.on=false;renderLineAdmin();return}
  sync.checking=true;sync.err='';renderLineAdmin();
  try{const p=await api({a:'ping',key:l.key},true);
    if(!p||!p.ok)throw new Error(p&&p.error||'ติดต่อไม่ได้');
    sync.staffOk=!!p.staff; if(l.key&&!p.staff)throw new Error('STAFF_KEY ไม่ถูกต้อง');
    sync.on=true;sync.line=!!p.line;
    if(isOwner()&&sync.staffOk){await pushLineCfg();if(manual){await uploadLocal();appCfgChanged()}}
    await pullAppCfg();
    await pullNow(true);
    bookings.forEach(b=>{if(!sync.snap[b.id])sync.snap[b.id]=stab(b)}); // local-only demo data stays on this device
    if(manual)toast('เชื่อมต่อระบบหลังบ้านแล้ว');
  }catch(e){sync.on=false;sync.err=String(e.message||e);if(manual)toast('เชื่อมต่อไม่ได้: '+sync.err)}
  sync.checking=false;renderLineAdmin();
}
async function pushLineCfg(){
  const l=L(); if(!sync.on||!sync.staffOk||!isOwner())return;
  const r=await api({a:'config',key:l.key,cfg:{shopName:cfg.shopName,branch:cfg.branch,phone:cfg.phone,appUrl:location.href.split('#')[0],lateMin:lateMin(),remindMin:l.remindMin,cancelBefore:cancelMin(),
    notify:l.notify,ownerCopy:l.ownerCopy,barbers:cfg.barbers.map(b=>({id:b.id,name:b.name})),services:cfg.services.map(s=>({id:s.id,name:s.name,min:s.min,price:s.price}))}});
  if(r.ok){l.staff=r.staff;saveJSON(CKEY,cfg)}
}

async function pullAppCfg(){
  try{const r=await api({a:'appcfg'},true);const a=r&&r.app;if(!a||!a.cfg||(cfg.cfgAt||0)>=a.at)return;
    if(isOwner()&&(cfg.cfgLocalAt||0)>a.at)return; // owner has newer local edits; they will be uploaded

async function uploadLocal(){ // first connect: send this device's queue up so everyone starts from the same data
  const l=L(); let n=0;
  for(const b of bookings.filter(x=>x.date>=dkey(addDays(-60))&&!x.demo&&!sync.snap[x.id])){
    try{const r=await api({a:'create',key:l.key,booking:b});if(r.ok&&r.booking){Object.assign(b,r.booking);sync.snap[b.id]=stab(b);n++}}catch(e){}
  }
  saveJSON(KEY,bookings); if(n)toast('อัปโหลดคิวขึ้นระบบ '+n+' คิว');
}
async function pullNow(full){
  if(!sync.on)return;
  const l=L(), key=lineStaffKey();
  let r; try{r=await api({a:'list',since:full?0:sync.since,key},true)}catch(e){sync.err='ซิงก์ไม่ได้ ลองใหม่อัตโนมัติ';renderLineStatus();return}
  if(!r||!r.ok){sync.err=r&&r.error||'ซิงก์ไม่ได้';renderLineStatus();return}
  sync.err='';sync.last=Date.now();sync.since=r.now-3000;
  let changed=false; const lineActs=[];
  r.bookings.forEach(sb=>{
    if(sync.queue[sb.id])return; // local change waiting to upload wins until it is sent
    const lb=bookings.find(x=>x.id===sb.id);
    if(lb){const before=stab(lb);
      if(r.staff){Object.keys(lb).forEach(k=>{if(!(k in sb))delete lb[k]});Object.assign(lb,sb)}
      else ['date','start','dur','barberId','status','serviceId','services','updatedAt'].forEach(k=>{if(k in sb)lb[k]=sb[k]});
      if(stab(lb)!==before)changed=true}
    else{bookings.push(r.staff?sb:Object.assign({name:'',phone:''},sb));changed=true}
    sync.snap[sb.id]=stab(bookings.find(x=>x.id===sb.id));
    if(sb.lastAction&&sb.lastAction.via==='line'&&sb.lastAction.at>sync.lineSeen&&!full)lineActs.push(sb);
  });
  r.bookings.forEach(sb=>{if(sb.lastAction&&sb.lastAction.at>sync.lineSeen)sync.lineSeen=sb.lastAction.at});
  if(changed){saveJSON(KEY,bookings);if(!dlg.open)renderAdmin();else{renderSum();renderLive();if(!walkOpen)renderToday()}}
  if(user&&lineActs.length){const b=lineActs[lineActs.length-1],w={start:'เริ่มตัด',done:'ตัดเสร็จ',noshow:'บันทึกว่าไม่มา',release:'ปล่อยคิว',paid:'ยืนยันสลิป'}[b.lastAction.act]||'อัปเดต';
    toast(`LINE: ${lstaffName(b.lastAction.by)} ${w} ${b.name||''}`)}
  renderLineStatus();
}
function syncQueue(){ // called by save(): find bookings that changed locally since last sync
  if(!sync||!sync.on)return;
  bookings.forEach(b=>{if(b.demo)return;if(sync.snap[b.id]!==stab(b))sync.queue[b.id]=sync.snap[b.id]?'upd':'new'});
  clearTimeout(sync.flushT);sync.flushT=setTimeout(flushSync,250);
}
async function flushSync(){
  const l=L(), key=lineStaffKey();
  for(const id of Object.keys(sync.queue)){
    const kind=sync.queue[id], b=bookings.find(x=>x.id===id); if(!b){delete sync.queue[id];continue}
    let r=null;
    try{
      if(kind==='new')r=await api({a:'create',key,booking:b});
      else if(key)r=await api({a:'put',key,booking:Object.assign({},b,{_base:b.updatedAt||0})});
      else if(b.status==='cancelled')r=await api({a:'cancel',id,phone:b.phone});
      else if(b.pay&&b.pay.slip&&/^data:/.test(b.pay.slip))r=await api({a:'slip',id,phone:b.phone,slip:b.pay.slip});
      else{sync.snap[id]=stab(b);delete sync.queue[id];continue}
    }catch(e){sync.err='ส่งข้อมูลไม่ได้ จะลองใหม่อัตโนมัติ';renderLineStatus();return}
    delete sync.queue[id];
    if(r&&r.ok&&r.booking){Object.keys(b).forEach(k=>{if(!(k in r.booking))delete b[k]});Object.assign(b,r.booking);sync.snap[id]=stab(b)}

function lineAdd(to,m,silent){

function lineEvents(init){ // look for things that should notify (new booking, slip, reminders)
  if(!lineChat||!cfg)return;
  const l=L(),t=today(),nm=nowMin(),late=lateMin(),meta=lineChat.meta;let ch=false;
  if(!lineChat.ready){init=true;lineChat.ready=1}
  const ids=new Set();
  bookings.forEach(b=>{ids.add(b.id);const m=meta[b.id]||(meta[b.id]={});
    if(!m.seen){m.seen=1;ch=true;if(!init&&b.status==='confirmed'&&b.date>=t)lineNotify(b,'new')}
    if(b.pay&&b.pay.status==='review'&&b.pay.sentAt&&m.slip!==b.pay.sentAt){m.slip=b.pay.sentAt;ch=true;if(!init&&l.notify.slip!==false)lineAdd('owner',{kind:'slip',bid:b.id})}
    if(b.status==='cancelled'&&b.cancelledBy==='customer'&&!m.cx){m.cx=1;ch=true;if(!init&&b.date===t)lineNotify(b,'cancel')}
    if(b.date!==t||b.status!=='confirmed')return;
    if(!m.due&&nm>=b.start-l.remindMin&&nm<b.start+Math.max(late,1)){m.due=1;ch=true;if(!init)lineNotify(b,'due')}
    else if(late>0&&!m.late&&nm>=b.start+late&&nm<b.start+late+60){m.late=1;ch=true;if(!init)lineNotify(b,'late')}
  });

  if(ch)lineSaveChat();
}
function lineAct(act,bid,staff){ // same rules as the backend's onPostback_

  lineAdd(staff,{dir:'out',text:lbl+(b?' '+(b.name||''):'')},true);

  if(act==='start'){

    if(busy){say(`${barber(b.barberId).name} ยังตัดให้ ${busy.name} อยู่ กด "ตัดเสร็จ" คิวนั้นก่อน`);return lineAdd(staff,{kind:'cut',bid:busy.id},true)}
    b.status='inprogress';b.startedAt=nm;delete b.doneAt;b.lastAction=Object.assign({act},by);save();

  }else if(act==='noshow'||act==='release'){
    if(b.status!=='confirmed')return say(`คิว ${b.name} สถานะ "${STATUS[b.status]}" แล้ว`);
    b.status='noshow';b.lastAction=Object.assign({act},by);
    if(act==='release'){b.released=Date.now();if(isLocked(b))b.credit=b.pay.amount}save();
    say(`${act==='release'?'🔓 ปล่อยคิว ':'บันทึกว่าไม่มา: '}${b.name} (${fmt(b.start)}) แล้ว ช่วงนี้ลูกค้าคนอื่นจองได้${b.credit?`\nลูกค้าโอนแล้ว ${baht(b.credit)} ฿ เก็บเป็นเครดิตให้`:''}`);next();
  }else if(act==='paid'){
    if(me.role!=='owner')return say('เฉพาะเจ้าของร้าน');

  }

}
