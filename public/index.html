  const noNew=((n.due?1:0)+(n.late?.15:0))*(l.ownerCopy?2:1)+(n.slip?prepaid:0);
  return {perDay,month:Math.round(perDay*per*30),noNew:Math.round(perDay*noNew*30)}}

  ${sync.on&&sync.staffOk?`<h4 class="lh">เชื่อม LINE ของช่าง</h4><p class="hint">ให้แต่ละคนเพิ่มเพื่อน LINE OA ของร้าน แล้วพิมพ์รหัส 6 หลักของตัวเองส่งในแชต</p><div class="lstaff">${LINE_STAFF().map(s=>{const i=staffInfo(s.id);

  <button class="linkbtn lguide-t" id="lGuideT" aria-expanded="${lineGuide}">${lineGuide?'ซ่อน':'ดู'}วิธีตั้งค่า LINE (ทำครั้งเดียว ประมาณ 15 นาที)</button>

    <li><b>ตั้งตัวเช็กคิวทุกนาที (ฟรี)</b><br>ที่ <a href="https://cron-job.org" target="_blank" rel="noopener">cron-job.org</a> สร้างงานใหม่ เรียก <code>${esc(APP_HOST())}/api/tick?key=CRON_SECRET</code> ทุก 1 นาที (ค่า CRON_SECRET อยู่ใน Vercel) · แอพที่เปิดค้างในร้านก็ช่วยเช็กให้ด้วย</li>
    <li><b>เชื่อมแอพ</b><br>เปิดแอพจาก <code>${esc(APP_HOST())}</code> > เข้าสู่ระบบเจ้าของร้าน > ใส่ STAFF_KEY > เชื่อมต่อ > ให้ช่างเพิ่มเพื่อน OA แล้วส่งรหัส 6 หลักของตัวเอง > กด "ทดสอบส่ง"</li></ol>
    <p class="hint">ตรวจความพร้อมได้ที่ <code>${esc(APP_HOST())}/api/app?a=health</code></p>`:''}

var lineRendering=false;
function renderLineAdmin(){if(!secLine||lineRendering)return;if(!isOwner()){secLine.innerHTML='';return}
  const f=document.activeElement&&secLine.contains(document.activeElement)?document.activeElement.id:'';
  if(f==='lUrl'||f==='lKey'||f==='lRemind'){renderLineStatus();return} // don't wipe a field the owner is typing in
  lineRendering=true;try{secLine.innerHTML=lineAdminHTML()}finally{lineRendering=false}}
document.addEventListener('change',e=>{const t=e.target;if(!isOwner())return;const l=L();
  if(t.dataset.lnot){l.notify[t.dataset.lnot]=t.checked;saveCfg();renderLineAdmin();lineCfgChanged()}
  else if(t.id==='lOwnerCopy'){l.ownerCopy=t.checked;saveCfg();renderLineAdmin();lineCfgChanged()}
  else if(t.id==='lPreview'){l.preview=t.checked;saveCfg()}
  else if(t.id==='lRemind'){const v=Math.round(+t.value);if(!(v>=0&&v<=60)){t.value=l.remindMin;toast('ใส่ 0–60 นาที');return}l.remindMin=v;saveCfg();lineCfgChanged();toast('แจ้งก่อนถึงคิว '+v+' นาที')}
  else if(t.id==='lUrl'){l.url=t.value.trim();saveCfg();const c=document.getElementById('lConnect');if(c)c.disabled=!l.url}
  else if(t.id==='lKey'){l.key=t.value.trim();saveCfg()}
});
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t||!isOwner())return;const l=L();
  if(t.id==='lConnect'){const u=document.getElementById('lUrl'),k=document.getElementById('lKey');if(u)l.url=u.value.trim();l.key=k.value.trim();saveCfg();
    if(l.url&&!/^https:\/\/[^/]+\/./.test(l.url)&&!/^http:\/\/(localhost|127\.0\.0\.1)/.test(l.url)){toast('URL ต้องขึ้นต้นด้วย https:// เช่น https://ชื่อแอพ.vercel.app/api/app');return}
    lineConnect(true)}
  else if(t.id==='lDisconnect'){if(!confirm('เลิกเชื่อมระบบหลังบ้าน? คิวในเครื่องนี้ยังอยู่'))return;l.url='';sync.on=false;sync.snap={};sync.queue={};saveCfg();renderLineAdmin()}
  else if(t.id==='lGuideT'){lineGuide=!lineGuide;renderLineAdmin()}
  else if(t.dataset.lcopy){try{await navigator.clipboard.writeText(t.dataset.lcopy);toast('คัดลอกรหัส '+t.dataset.lcopy)}catch(_){toast('รหัส '+t.dataset.lcopy)}}
  else if(t.dataset.ltest){try{const r=await api({a:'test',key:l.key,staffId:t.dataset.ltest});toast(r.ok?'ส่งข้อความทดสอบแล้ว ดูใน LINE ได้เลย':'ส่งไม่ได้: '+(r.error||''))}catch(err){toast('ส่งไม่ได้ ตรวจ URL อีกครั้ง')}}
  else if(t.dataset.lunlink){if(!confirm('ยกเลิกการเชื่อม LINE ของคนนี้?'))return;try{const r=await api({a:'unlink',key:l.key,staffId:t.dataset.lunlink});if(r.ok){l.staff=r.staff;saveJSON(CKEY,cfg);renderLineAdmin()}}catch(err){toast('ทำไม่ได้ตอนนี้')}}
});

function openWelcome(edit){
  dlg.innerHTML=`<div class="welcome"><div class="wc-ic">${ic('scissors',26)}</div>
    <h3>${edit?'แก้ชื่อ/เบอร์ของฉัน':'ยินดีต้อนรับสู่ '+esc(cfg.shopName||'ร้านของเรา')}</h3>
    <p class="meta">${edit?'ใช้สำหรับจองคิวและดูแต้มสะสม':'ใส่ชื่อเล่นกับเบอร์โทรครั้งเดียว ใช้จองคิวและสะสมแต้มได้เลย'}</p>
    <div class="form"><label>ชื่อเล่น<input id="wcName" autocomplete="nickname" maxlength="30" placeholder="เช่น ต้น" value="${esc(custMe?.name||'')}"></label>
    <label>เบอร์โทร<input id="wcPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="12" placeholder="08x-xxx-xxxx" value="${esc(custMe?.phone||'')}"></label>
    <p class="err" id="wcErr" hidden></p>
    <button class="primary" id="wcGo">${edit?'บันทึก':'เริ่มใช้งาน'}</button></div>
    ${edit?'<button data-close class="ghost" style="width:100%;margin-top:8px">ยกเลิก</button>':'<button class="linkbtn wc-staff" id="wcStaff">ช่าง / เจ้าของร้าน เข้าสู่ระบบ</button>'}</div>`;
  dlg.classList.add('wide');dlg.dataset.id='';if(edit)delete dlg.dataset.welcome;else dlg.dataset.welcome='1';
  if(!dlg.open)dlg.showModal();setTimeout(()=>document.getElementById('wcName')?.focus(),60);
}
function saveWelcome(){
  const n=document.getElementById('wcName').value.trim(), p=document.getElementById('wcPhone').value.trim(), e=document.getElementById('wcErr');
  const bad=!n?'ใส่ชื่อเล่นก่อนนะครับ':phoneKey(p).length<9||phoneKey(p).length>10?'ใส่เบอร์โทรให้ครบ':'';
  if(bad){e.textContent=bad;e.hidden=false;return}
  const old=custMe;custMe={name:n,phone:p};saveJSON('barber-me',custMe);upsertCustomer(n,p);
  if(!sel.name||(old&&sel.name===old.name))sel.name=n; if(!sel.phone||(old&&sel.phone===old.phone))sel.phone=p;
  if(old&&phoneKey(old.phone)!==phoneKey(p))myLookup=null;
  delete dlg.dataset.welcome;dlg.close();renderCustomer();if(view==='mine')renderMine();toast('สวัสดีคุณ'+n+' จองคิวได้เลย');
}
const needWelcome=()=>!custMe&&!user;
dlg.addEventListener('cancel',e=>{if(dlg.dataset.welcome)e.preventDefault()});
dlg.addEventListener('close',()=>{delete dlg.dataset.welcome;if(needWelcome())setTimeout(()=>{if(needWelcome()&&!dlg.open)openWelcome(false)},250)});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.id==='wcGo')saveWelcome();
  else if(t.id==='wcStaff'){delete dlg.dataset.welcome;openLogin()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='wcName'||e.target.id==='wcPhone')){e.preventDefault();if(e.target.id==='wcName')document.getElementById('wcPhone').focus();else saveWelcome()}});
updateHours(); renderAuth(); renderAdmin(); renderLineBtn(); lineEvents(true); if(BACKEND())lineConnect(false);
if(needWelcome())setTimeout(()=>{if(needWelcome()&&!dlg.open)openWelcome(false)},600);
gfxInit().then(()=>{applyGfx();if(Object.keys(gfx).length){renderAdmin();renderMine()}else renderGfx()});
syncIndicators(); indObs.observe(document.body,{childList:true,subtree:true});
